name: orangre piano — Android release

on:
  push:
    branches: ["orangre-piano/**"]
    paths:
      - "orangre-piano/**"
      - ".github/workflows/orangre-piano.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orangre-piano-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orangre-piano
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build and lint badge-enabled launcher
        run: gradle :app:assembleDebug :app:lintDebug --stacktrace

      - name: Verify APK signature, metadata and notification listener
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$SIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/orangre-badging.txt"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > "$RUNNER_TEMP/orangre-manifest.txt"
          grep -q "package: name='com.orangrepiano.launcher'" "$RUNNER_TEMP/orangre-badging.txt"
          grep -q "targetSdkVersion:'36'" "$RUNNER_TEMP/orangre-badging.txt"
          grep -q "application-icon-" "$RUNNER_TEMP/orangre-badging.txt"
          grep -q 'BIND_NOTIFICATION_LISTENER_SERVICE' "$RUNNER_TEMP/orangre-manifest.txt"
          grep -q 'PianoNotificationListener' "$RUNNER_TEMP/orangre-manifest.txt"
          echo "Verified: only badge-enabled APK, listener present and user authorization required"

      - uses: actions/upload-artifact@v4
        with:
          name: orangre-piano-1.1.10-rc1-apk
          path: orangre-piano/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare protected production signing
        env:
          PIANO_KEYSTORE_B64: ${{ secrets.PIANO_KEYSTORE_B64 }}
          PIANO_STORE_PASSWORD: ${{ secrets.PIANO_STORE_PASSWORD }}
          PIANO_KEY_ALIAS: ${{ secrets.PIANO_KEY_ALIAS }}
          PIANO_KEY_PASSWORD: ${{ secrets.PIANO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$PIANO_KEYSTORE_B64" && -n "$PIANO_STORE_PASSWORD" && -n "$PIANO_KEY_ALIAS" && -n "$PIANO_KEY_PASSWORD" ]]; then
            umask 077
            printf '%s' "$PIANO_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/orangre-piano-release.jks"
            keytool -list -keystore "$RUNNER_TEMP/orangre-piano-release.jks" \
              -storepass "$PIANO_STORE_PASSWORD" -alias "$PIANO_KEY_ALIAS" >/dev/null
            # Pin the *public* certificate digest so no future accidental key rotation
            # can make users uninstall the launcher and lose local settings.
            ACTUAL_SIGNER_SHA256="$(keytool -exportcert \
              -keystore "$RUNNER_TEMP/orangre-piano-release.jks" \
              -storepass "$PIANO_STORE_PASSWORD" -alias "$PIANO_KEY_ALIAS" \
              | sha256sum | awk '{print $1}')"
            EXPECTED_SIGNER_SHA256="fb4eddbe667de1b59158cf725c687e8cd779f611ef2afd91e86194e2a9fae2e6"
            if [[ "$ACTUAL_SIGNER_SHA256" != "$EXPECTED_SIGNER_SHA256" ]]; then
              echo "::error::Wrong Orangre Piano release certificate. Refusing to publish an incompatible APK."
              exit 1
            fi
            echo "Confirmed pinned permanent signing certificate: $EXPECTED_SIGNER_SHA256"
            echo "PIANO_RELEASE_READY=true" >> "$GITHUB_ENV"
          else
            echo "PIANO_RELEASE_READY=false" >> "$GITHUB_ENV"
            echo "::notice::No protected signing key configured. Publishing a debug-signed release candidate, not a Play Store release."
          fi

      - name: Build signed production APK and AAB
        if: env.PIANO_RELEASE_READY == 'true'
        env:
          PIANO_KEYSTORE_PATH: ${{ runner.temp }}/orangre-piano-release.jks
          PIANO_STORE_PASSWORD: ${{ secrets.PIANO_STORE_PASSWORD }}
          PIANO_KEY_ALIAS: ${{ secrets.PIANO_KEY_ALIAS }}
          PIANO_KEY_PASSWORD: ${{ secrets.PIANO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle :app:assembleRelease :app:bundleRelease --stacktrace
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk \
            | grep -qi "fb4eddbe667de1b59158cf725c687e8cd779f611ef2afd91e86194e2a9fae2e6"
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Upload production deliverables
        if: env.PIANO_RELEASE_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: orangre-piano-v1.1.10-signed-release
          path: |
            orangre-piano/app/build/outputs/apk/release/app-release.apk
            orangre-piano/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Publish GitHub preview or signed release
        if: github.ref == 'refs/heads/orangre-piano/dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$PIANO_RELEASE_READY" == "true" ]]; then
            TAG="orangre-piano-v1.1.10"
            cp app/build/outputs/apk/release/app-release.apk ../orangre-piano-v1.1.10.apk
            cp app/build/outputs/bundle/release/app-release.aab ../orangre-piano-v1.1.10.aab
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$TAG" ../orangre-piano-v1.1.10.apk ../orangre-piano-v1.1.10.aab --clobber --repo "$GITHUB_REPOSITORY"
            else
              gh release create "$TAG" ../orangre-piano-v1.1.10.apk ../orangre-piano-v1.1.10.aab \
                --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
                --title "orangre piano 1.1.10 — ATELIER" \
                --notes "Orangre Piano 1.1.10 ATELIER: 5–8 synchronized favorite/To-Do rows with aligned baselines, persistent 8-slot notes after resizing, unchanged premium styling and fixed glass-panel height. All v1.1.9 performance and Pixel Fold improvements retained. Stable APK only if the pinned permanent signing key is configured."
            fi
          else
            TAG="orangre-piano-v1.1.10-rc1"
            cp app/build/outputs/apk/debug/app-debug.apk ../orangre-piano-v1.1.10-rc1.apk
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$TAG" ../orangre-piano-v1.1.10-rc1.apk --clobber --repo "$GITHUB_REPOSITORY"
            else
              gh release create "$TAG" ../orangre-piano-v1.1.10-rc1.apk \
                --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
                --title "orangre piano 1.1.10 RC1 — ATELIER" \
                --notes "Orangre Piano 1.1.10 RC1: 5–8 synchronized favorite/To-Do rows, preserved notes on decreasing and increasing the count. Debug-only certificate: do not replace your working installation until permanent signing secrets are configured." \
                --prerelease
            fi
          fi

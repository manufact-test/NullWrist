name: Cleanup NullWrist maintenance branches

on:
  push:
    branches:
      - cleanup-nullwrist-maintenance

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Remove one-time workflow from main
        run: |
          set -euo pipefail
          rm .github/workflows/cleanup-nullwrist-maintenance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/cleanup-nullwrist-maintenance.yml
          git commit -m "Finish NullWrist maintenance cleanup [skip ci]"
          git push origin HEAD:main

      - name: Delete temporary branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for branch in \
            rebrand-nullwrist \
            release-nullwrist-0.8.11 \
            refresh-nullwrist-release-history \
            cleanup-nullwrist-maintenance
          do
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" \
              >/dev/null 2>&1 || true
          done

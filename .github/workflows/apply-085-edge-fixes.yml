name: Apply Pebblehertz 0.8.5 edge fixes

on:
  push:
    branches: ["feature/native-qemu-runtime"]
    paths:
      - ".github/workflows/apply-085-edge-fixes.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply and commit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          qemu_path = Path('app/src/main/java/com/manufacttest/pebblereardisplay/runtime/PebbleQemuProcess.java')
          qemu = qemu_path.read_text(encoding='utf-8')
          pattern = re.compile(r'''    public boolean activateWatchface\(\n            File pbwFile,\n            InstalledWatchfaceRegistry registry,\n            PebbleAppInstaller\.ProgressListener progressListener\n    \) throws IOException, InterruptedException \{.*?\n    \}\n\n    public void installWatchface''', re.S)
          replacement = '''    public boolean activateWatchface(\n            File pbwFile,\n            InstalledWatchfaceRegistry registry,\n            PebbleAppInstaller.ProgressListener progressListener\n    ) throws IOException, InterruptedException {\n        if (pbwFile == null || !pbwFile.isFile()) {\n            throw new IOException("Selected PBW file is missing");\n        }\n        if (!isRunning()) {\n            throw new IOException("PebbleOS is not running");\n        }\n        if (!firmwareReady) {\n            waitForFirmwareReady(30_000);\n        }\n\n        String fingerprint = InstalledWatchfaceRegistry.sha256(pbwFile);\n        PebbleProtocolLink link = protocolLink(20_000);\n        try (PebblePbwBundle bundle = new PebblePbwBundle(pbwFile)) {\n            PebblePbwBundle.AppHeader header = bundle.getHeader();\n            if (registry.isInstalled(header.getUuid(), fingerprint)) {\n                IOException launchFailure = null;\n                try {\n                    new PebbleAppInstaller(link, progressListener).launch(\n                            header.getUuid(),\n                            header.getAppName()\n                    );\n                    return false;\n                } catch (IOException firstFailure) {\n                    launchFailure = firstFailure;\n                    invalidateProtocolLink(link);\n                }\n\n                try {\n                    link = protocolLink(8_000);\n                    new PebbleAppInstaller(link, progressListener).launch(\n                            header.getUuid(),\n                            header.getAppName()\n                    );\n                    return false;\n                } catch (IOException secondFailure) {\n                    secondFailure.addSuppressed(launchFailure);\n                    launchFailure = secondFailure;\n                    invalidateProtocolLink(link);\n                }\n\n                // The Android registry can outlive a replaced/corrupted SPI AppDB. Repair it\n                // automatically instead of leaving all later commands stuck behind a stale entry.\n                registry.forget(header.getUuid());\n                try {\n                    link = protocolLink(8_000);\n                    new PebbleAppInstaller(link, progressListener).install(bundle);\n                    registry.markInstalled(header.getUuid(), fingerprint);\n                    return true;\n                } catch (IOException installFailure) {\n                    installFailure.addSuppressed(launchFailure);\n                    throw installFailure;\n                }\n            }\n\n            new PebbleAppInstaller(link, progressListener).install(bundle);\n            registry.markInstalled(header.getUuid(), fingerprint);\n            return true;\n        } catch (IOException error) {\n            invalidateProtocolLink(link);\n            throw error;\n        }\n    }\n\n    public void installWatchface'''
          qemu, count = pattern.subn(replacement, qemu, count=1)
          if count != 1:
              raise SystemExit('Could not replace activateWatchface exactly once')
          qemu_path.write_text(qemu, encoding='utf-8')

          service_path = Path('app/src/main/java/com/manufacttest/pebblereardisplay/runtime/PebbleRuntimeService.java')
          service = service_path.read_text(encoding='utf-8')
          old = '''            if (previousId != null) {\n                previous = watchfaceByStorageId(previousId);\n            }\n            SelectedWatchface selected = selectedWatchface();\n'''
          new = '''            if (previousId != null) {\n                try {\n                    previous = watchfaceByStorageId(previousId);\n                } catch (IOException missingPrevious) {\n                    // The active PBW may just have been deleted. Continue with the replacement.\n                    previous = null;\n                }\n            }\n            SelectedWatchface selected = selectedWatchface();\n'''
          if service.count(old) != 1:
              raise SystemExit(f'Expected one previous-watchface block, found {service.count(old)}')
          service_path.write_text(service.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/apply-085-edge-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden PBW recovery and active-face deletion"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Serialize Pebble runtime control

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/run-stage1-serialization-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/0.8.10-reliable-runtime
          fetch-depth: 0

      - name: Apply serialization patch
        id: patch
        continue-on-error: true
        run: |
          set +e
          python3 .github/scripts/serialize_runtime.py > .stage1-serialization.log 2>&1
          code=$?
          echo "exit_code=$code" > .stage1-serialization-status.txt
          echo "run_id=${{ github.run_id }}" >> .stage1-serialization-status.txt
          exit 0

      - name: Commit result to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if grep -q '^exit_code=0$' .stage1-serialization-status.txt; then
            rm -f .github/scripts/serialize_runtime.py
          fi
          git add -A
          git commit -m "Serialize Pebble runtime control"
          git push origin HEAD:agent/0.8.10-reliable-runtime

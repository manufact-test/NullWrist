name: Publish Pebblehertz v0.8.10

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.8.10.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.0.13004108" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pebble-rear-display-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/pebble-rear-display-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Fetch pinned runtime assets
        env:
          PEBBLE_SDK_VERSION: "4.17"
        run: |
          python3 scripts/fetch_bundled_watchfaces.py
          python3 scripts/fetch_pebble_basalt_firmware.py

      - name: Test and assemble signed release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/pebble-rear-display-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:testDebugUnitTest :app:assembleRelease

      - name: Verify and prepare release files
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk | tee release-certificate.txt
          cp app/build/outputs/apk/release/app-release.apk Pebblehertz-0.8.10.apk
          sha256sum Pebblehertz-0.8.10.apk | tee apk-sha256.txt
          cp CHANGELOG_0.8.10.md release-notes.md

      - name: Upload signed build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pebblehertz-0.8.10-signed-release
          path: |
            Pebblehertz-0.8.10.apk
            release-certificate.txt
            apk-sha256.txt
            release-notes.md
          if-no-files-found: error

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.8.10
          target_commitish: 31be615c57754fa7d45ef36a38ee62b7b0c0ddd4
          name: Pebblehertz 0.8.10 Beta
          prerelease: true
          make_latest: true
          fail_on_unmatched_files: true
          files: Pebblehertz-0.8.10.apk
          body_path: release-notes.md

      - name: Record result and remove temporary runner
        run: |
          set -euo pipefail
          APK_SHA="$(sha256sum Pebblehertz-0.8.10.apk | awk '{print $1}')"
          printf 'run_id=%s\ntag=v0.8.10\nasset=Pebblehertz-0.8.10.apk\nsha256=%s\nrelease_url=https://github.com/manufact-test/Pebblehertz/releases/tag/v0.8.10\ndownload_url=https://github.com/manufact-test/Pebblehertz/releases/download/v0.8.10/Pebblehertz-0.8.10.apk\n' "$GITHUB_RUN_ID" "$APK_SHA" > .release-v0.8.10-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-v0.8.10.yml
          git add .release-v0.8.10-result.txt
          git commit -m "Record v0.8.10 release result [skip ci]"
          git push origin HEAD:main

name: One-shot runtime UI listener optimization

on:
  push:
    branches: ["feature/native-qemu-runtime"]
    paths:
      - "scripts/patch_runtime_ui_listener.py"
      - ".github/workflows/one-shot-runtime-ui-listener.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/native-qemu-runtime

      - name: Apply targeted MainActivity listener patch
        run: python3 scripts/patch_runtime_ui_listener.py

      - name: Remove one-shot patch machinery
        run: |
          rm scripts/patch_runtime_ui_listener.py
          rm .github/workflows/one-shot-runtime-ui-listener.yml

      - name: Commit optimized runtime listener
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/manufacttest/pebblereardisplay/ui/MainActivity.java
          git add -u scripts/patch_runtime_ui_listener.py .github/workflows/one-shot-runtime-ui-listener.yml
          git commit -m "Re-render watchface locker only when active runtime changes"
          git push origin HEAD:feature/native-qemu-runtime

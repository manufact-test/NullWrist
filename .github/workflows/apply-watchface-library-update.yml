name: Apply Pebblehertz 0.8.2 library update

on:
  push:
    branches: ["feature/native-qemu-runtime"]
    paths: [".github/workflows/apply-watchface-library-update.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/native-qemu-runtime
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recover and run the prepared update script
        run: |
          git show 85ea7e969755d39568940f1fa1efafa40501b2ae:.github/workflows/apply-watchface-library-update.yml > /tmp/prepared-update.yml
          python3 - <<'PY'
          from pathlib import Path
          source = Path('/tmp/prepared-update.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("          PY\n\n      - name: Download and validate pinned PBWs", start)
          block = source[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          Path('/tmp/apply-watchface-update.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python3 /tmp/apply-watchface-update.py

      - name: Download and validate pinned PBWs
        run: python3 scripts/fetch_bundled_watchfaces.py

      - name: Verify Basalt compatibility and library size
        run: |
          python3 - <<'PY'
          import json
          import zipfile
          from pathlib import Path
          entries = json.loads(Path('bundled-watchfaces.json').read_text())
          assert len(entries) == 15, len(entries)
          directory = Path('app/src/main/assets/watchfaces')
          files = sorted(directory.glob('*.pbw'))
          assert len(files) == 15, [item.name for item in files]
          for entry in entries:
              path = directory / entry['file']
              with zipfile.ZipFile(path) as archive:
                  names = set(archive.namelist())
                  assert 'basalt/manifest.json' in names or 'manifest.json' in names, path
                  json.loads(archive.read('appinfo.json'))
              print(f"OK {entry['name']}: {path.stat().st_size} bytes")
          PY

      - name: Commit Pebblehertz 0.8.2 update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-watchface-library-update.yml
          git add -A
          git commit -m "Add eight Pebble Time faces and delay preview capture"
          git push origin HEAD:feature/native-qemu-runtime

name: Patch Pebblehertz 0.8.9 notification and donate dialog

on:
  push:
    branches: ["feature/minor-fixes-0.8.9"]
    paths:
      - ".github/workflows/patch-089-notification-donate.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/minor-fixes-0.8.9
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch MainActivity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/src/main/java/com/manufacttest/pebblereardisplay/ui/MainActivity.java")
          text = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              "package com.manufacttest.pebblereardisplay.ui;\n\nimport android.app.Activity;",
              "package com.manufacttest.pebblereardisplay.ui;\n\nimport android.Manifest;\nimport android.app.Activity;",
              "Manifest import",
          )
          replace_once(
              "import android.content.SharedPreferences;\nimport android.content.res.Configuration;",
              "import android.content.SharedPreferences;\nimport android.content.pm.PackageManager;\nimport android.content.res.Configuration;",
              "PackageManager import",
          )
          replace_once(
              "    private static final int REQUEST_IMPORT_PBW = 1001;\n",
              "    private static final int REQUEST_IMPORT_PBW = 1001;\n    private static final int REQUEST_NOTIFICATIONS = 1002;\n",
              "notification request code",
          )

          support_method = '''    private void showSupportDialog() {
              new AlertDialog.Builder(this)
                      .setTitle("Support Pebblehertz")
                      .setMessage("Choose a platform. Thank you for helping the project grow!")
                      .setPositiveButton("Wise", (dialog, which) -> openExternalLink(
                              "https://wise.com/pay/me/ilyas709"
                      ))
                      .setNeutralButton("PayPal", (dialog, which) -> openExternalLink(
                              "https://www.paypal.me/myarrogantfox"
                      ))
                      .setNegativeButton("Cancel", null)
                      .show();
          }
          '''
          text, count = re.subn(
              r"    private void showSupportDialog\(\) \{.*?\n    \}\n\n    private void openExternalLink",
              support_method + "\n    private void openExternalLink",
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f"support dialog: expected one match, found {count}")

          background_methods = '''    private void maybeRequestBackgroundSetup() {
              getWindow().getDecorView().post(() -> {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU
                          && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)
                          != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(
                              new String[]{Manifest.permission.POST_NOTIFICATIONS},
                              REQUEST_NOTIFICATIONS
                      );
                      return;
                  }
                  maybeShowBatteryPrompt();
              });
          }

          @Override
          public void onRequestPermissionsResult(
                  int requestCode,
                  String[] permissions,
                  int[] grantResults
          ) {
              super.onRequestPermissionsResult(requestCode, permissions, grantResults);
              if (requestCode == REQUEST_NOTIFICATIONS) {
                  maybeShowBatteryPrompt();
              }
          }
          '''
          text, count = re.subn(
              r"    private void maybeRequestBackgroundSetup\(\) \{.*?\n    \}\n\n    private void maybeShowBatteryPrompt",
              background_methods + "\n    private void maybeShowBatteryPrompt",
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f"notification request flow: expected one match, found {count}")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/patch-089-notification-donate.yml

      - name: Validate and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore notification permission and fix donate buttons"
          git push origin HEAD:feature/minor-fixes-0.8.9

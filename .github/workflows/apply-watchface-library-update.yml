          manifest.extend(item for item in additions if item["file"] not in existing)
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")

          fetch_path = root / "scripts/fetch_bundled_watchfaces.py"
          fetch = fetch_path.read_text(encoding="utf-8")
          fetch = fetch.replace(
              "import shutil\nimport sys\n",
              "import shutil\nimport subprocess\nimport sys\n"

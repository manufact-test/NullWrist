name: Run one-mode cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/run-finish-one-mode.yml

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/0.8.10-reliable-runtime
          fetch-depth: 0
      - name: Apply cleanup
        run: |
          set +e
          python3 tools/finish_one_mode.py > .finish-one-mode-log.txt 2>&1
          code=$?
          printf 'exit_code=%s\nrun_id=%s\n' "$code" "$GITHUB_RUN_ID" > .finish-one-mode-result.txt
          if [[ "$code" == "0" ]]; then
            rm -f tools/finish_one_mode.py .simplify-runtime-log.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish stability-first cleanup"
          git push origin HEAD:agent/0.8.10-reliable-runtime
          exit "$code"

# Run idempotent final hardening pass.

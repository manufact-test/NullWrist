name: orangre piano APK

on:
  push:
    branches: ["orangre-piano/**"]
    paths:
      - "orangre-piano/**"
      - ".github/workflows/orangre-piano.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orangre-piano
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Assemble independent debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: orangre-piano-debug-apk
          path: orangre-piano/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish orangre piano v0.4.0 to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/orangre-piano/dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk ../orangre-piano-v0.4.0.apk
          TAG="orangre-piano-v0.4.0"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" ../orangre-piano-v0.4.0.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "orangre piano v0.4.0 (Titan 2)" \
              --notes "orangre piano 0.4 — Atelier Design Pass. Custom rendered 5x7 pixel clock, polished layered copper/pearl glass, quiet background grid and light, animated press states, magnetic bilingual A-Z letter rail with haptic navigation and floating letter loupe, unified refined settings. Same core launcher, camera, torch, wallpapers and keyboard search. DEBUG signing changes between GitHub runners: uninstall previous test APK before installing. NullWrist remains independent." \
              --prerelease
          else
            gh release upload "$TAG" ../orangre-piano-v0.4.0.apk --clobber --repo "$GITHUB_REPOSITORY"
          fi

name: One-shot fix notification builder

on:
  push:
    branches:
      - agent/0.8.10-reliable-runtime
    paths:
      - .github/workflows/one-shot-fix-notification-builder.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/0.8.10-reliable-runtime
          fetch-depth: 0

      - name: Remove unsupported Notification.Builder call
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/manufacttest/pebblereardisplay/runtime/PebbleRuntimeService.java")
          text = path.read_text(encoding="utf-8")
          old = "                .setSilent(true)\n"
          if text.count(old) != 1:
              raise SystemExit("Expected one setSilent call")
          path.write_text(text.replace(old, "", 1), encoding="utf-8")
          PY

      - name: Commit compile fix
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-fix-notification-builder.yml
          git add app/src/main/java/com/manufacttest/pebblereardisplay/runtime/PebbleRuntimeService.java
          git commit -m "Fix runtime notification builder compatibility"
          git push origin HEAD:agent/0.8.10-reliable-runtime

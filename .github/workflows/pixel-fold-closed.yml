name: Pixel Fold CLOSED APK
on:
  push:
    branches: [main]
    paths:
      - 'tools/pixel-fold-closed-lock/**'
      - '.github/workflows/pixel-fold-closed.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/pixel-fold-closed-lock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Validate APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Pixel-Fold-CLOSED-v0.2.0-beta1
          path: tools/pixel-fold-closed-lock/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish prerelease
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create pixel-fold-closed-v0.2.0-beta1 \
            "app/build/outputs/apk/debug/app-debug.apk#Pixel-Fold-CLOSED-v0.2.0-beta1.apk" \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Pixel Fold CLOSED 0.2.0 beta 1" \
            --notes "Requires Shizuku. Requests base-state CLOSED (0) via shell; unverified on real Pixel Fold Android 17. See README." \
            --prerelease --latest=false

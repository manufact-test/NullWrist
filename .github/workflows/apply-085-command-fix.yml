name: Apply Pebblehertz 0.8.5 command fixes

on:
  push:
    branches: ["feature/native-qemu-runtime"]
    paths:
      - "scripts/apply_085_command_fix.py"
      - ".github/workflows/apply-085-command-fix.yml"

concurrency:
  group: apply-pebblehertz-085-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Validate and apply migration
        run: |
          python3 -m py_compile scripts/apply_085_command_fix.py
          python3 scripts/apply_085_command_fix.py

      - name: Commit clean 0.8.5 source
        run: |
          rm scripts/apply_085_command_fix.py
          rm .github/workflows/apply-085-command-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix native TCG command sequencing and Night Mode UI"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Repository deep cleanup

on:
  push:
    branches:
      - cleanup-repository
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  actions: write
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: github.event_name == 'push' || github.event.pull_request.title == '[cleanup-repository]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Keep future merges tidy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}" \
            -F delete_branch_on_merge=true >/dev/null 2>&1 || true

      - name: Delete all non-main branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" \
            --jq '.[].name' | while IFS= read -r branch; do
              [[ "$branch" == "main" ]] && continue
              encoded="$(jq -rn --arg value "$branch" '$value|@uri')"
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded}" \
                >/dev/null 2>&1 || true
            done

      - name: Delete cached build data and Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh cache delete --all --confirm || true
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[].id' | while IFS= read -r artifact_id; do
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" \
                >/dev/null 2>&1 || true
            done

      - name: Prune obsolete workflow history
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | [.id, .name, .status, (.conclusion // ""), .created_at] | @tsv' \
            > "$RUNNER_TEMP/runs.tsv"

          python3 - "$RUNNER_TEMP/runs.tsv" "$RUNNER_TEMP/delete-runs.txt" "$CURRENT_RUN_ID" <<'PY'
          import sys
          from collections import defaultdict
          from pathlib import Path

          source = Path(sys.argv[1])
          destination = Path(sys.argv[2])
          current_run = sys.argv[3]
          keep_limits = {
              "Android build": 3,
              "Publish NullWrist release": 3,
          }
          kept = defaultdict(int)
          delete = []

          for line in source.read_text(encoding="utf-8").splitlines():
              run_id, name, status, conclusion, created_at = line.split("\t", 4)
              if run_id == current_run or status != "completed":
                  continue
              limit = keep_limits.get(name, 0)
              if conclusion == "success" and kept[name] < limit:
                  kept[name] += 1
                  continue
              delete.append(run_id)

          destination.write_text("\n".join(delete) + ("\n" if delete else ""), encoding="utf-8")
          PY

          while IFS= read -r run_id; do
            [[ -z "$run_id" ]] && continue
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
              >/dev/null 2>&1 || true
          done < "$RUNNER_TEMP/delete-runs.txt"

      - name: Remove one-time cleanup workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/deep-cleanup.yml
          git add .github/workflows/deep-cleanup.yml
          git commit -m "Finish repository cleanup [skip ci]"
          git push origin HEAD:main

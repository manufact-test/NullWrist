                  controls.setOrientation(LinearLayout.HORIZONTAL);
                  controls.setGravity(Gravity.CENTER_VERTICAL);
                  controls.setPadding(0, dp(8), 0, 0);

                  TextView action = pixelText(
                          active ? "ON AIR" : selected ? "APPLYING..." : "TAP TO APPLY >",

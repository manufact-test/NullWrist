name: Fix Pebblehertz 0.8.9 battery broadcasts

on:
  push:
    branches: ["feature/minor-fixes-0.8.9"]
    paths:
      - ".github/workflows/fix-089-battery-broadcasts.yml"
  pull_request:
    paths:
      - ".github/workflows/fix-089-battery-broadcasts.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/minor-fixes-0.8.9
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch battery broadcast handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/src/main/java/com/manufacttest/pebblereardisplay/runtime/PebbleRuntimeService.java")
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(
              r"    private void updateBatterySnapshot\(Intent intent\) \{.*?"
              r"\n    \}\n\n    private void syncBatteryToRuntime\(\) \{",
              re.S,
          )
          replacement = '''    private void updateBatterySnapshot(Intent intent) {
              if (intent == null) {
                  return;
              }
              String action = intent.getAction();
              if (Intent.ACTION_POWER_CONNECTED.equals(action)) {
                  phoneChargerConnected = true;
                  return;
              }
              if (Intent.ACTION_POWER_DISCONNECTED.equals(action)) {
                  phoneChargerConnected = false;
                  return;
              }
              if (!Intent.ACTION_BATTERY_CHANGED.equals(action)) {
                  return;
              }

              int level = intent.getIntExtra(BatteryManager.EXTRA_LEVEL, -1);
              int scale = intent.getIntExtra(BatteryManager.EXTRA_SCALE, -1);
              if (level >= 0 && scale > 0) {
                  phoneBatteryPercentage = Math.max(
                          0,
                          Math.min(100, Math.round(level * 100f / scale))
                  );
              }
              int status = intent.getIntExtra(
                      BatteryManager.EXTRA_STATUS,
                      BatteryManager.BATTERY_STATUS_UNKNOWN
              );
              int plugged = intent.getIntExtra(BatteryManager.EXTRA_PLUGGED, 0);
              phoneChargerConnected = plugged != 0
                      || status == BatteryManager.BATTERY_STATUS_CHARGING
                      || status == BatteryManager.BATTERY_STATUS_FULL;
          }

          private void syncBatteryToRuntime() {'''
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"Expected one battery method, found {count}")
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Validate and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/manufacttest/pebblereardisplay/runtime/PebbleRuntimeService.java
          git commit -m "Handle battery and time broadcasts separately"
          git push origin HEAD:feature/minor-fixes-0.8.9

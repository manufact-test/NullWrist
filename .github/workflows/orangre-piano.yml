name: orangre piano APK

on:
  push:
    branches: ["orangre-piano/**"]
    paths:
      - "orangre-piano/**"
      - ".github/workflows/orangre-piano.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orangre-piano
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Assemble independent debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: orangre-piano-debug-apk
          path: orangre-piano/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish orangre piano v0.3.1 to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/orangre-piano/dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk ../orangre-piano-v0.3.1.apk
          TAG="orangre-piano-v0.3.1"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" ../orangre-piano-v0.3.1.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "orangre piano v0.3.1 (Titan 2)" \
              --notes "Titan 2 text-only launcher: A-Z search and the square back arrow on one line, settings back arrow beside title, and swipe-down from the top of the app list to return home. Vertical panel transition animates the app drawer below the home screen. Camera, torch, wallpapers and existing settings remain. Debug signing keys vary per workflow run: uninstall the previous beta first. Independent from NullWrist." \
              --prerelease
          else
            gh release upload "$TAG" ../orangre-piano-v0.3.1.apk --clobber --repo "$GITHUB_REPOSITORY"
          fi

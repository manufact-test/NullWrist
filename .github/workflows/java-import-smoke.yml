name: Java PBW import smoke

on:
  push:
    branches: ["feature/native-qemu-runtime"]
    paths:
      - "app/src/main/java/com/manufacttest/pebblereardisplay/runtime/PebbleAppInstaller.java"
      - "app/src/main/java/com/manufacttest/pebblereardisplay/runtime/PebbleProtocolLink.java"
      - "scripts/java_installer_smoke.py"
      - ".github/workflows/java-import-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/native-qemu-runtime

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install QEMU build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git ninja-build pkg-config python3-venv \
            libglib2.0-dev libpixman-1-dev zlib1g-dev

      - name: Restore host QEMU source cache
        uses: actions/cache@v4
        with:
          path: .host-qemu-build/sources
          key: host-pebble-qemu-source-v2-9ef633fa

      - name: Fetch watchfaces and Basalt firmware
        env:
          PEBBLE_SDK_VERSION: "4.17"
        run: |
          python3 scripts/fetch_bundled_watchfaces.py
          python3 scripts/fetch_pebble_basalt_firmware.py

      - name: Build host Pebble QEMU
        env:
          QEMU_HOST_WORK_DIR: ${{ github.workspace }}/.host-qemu-build
          QEMU_HOST_OUTPUT_DIR: ${{ github.workspace }}/host-qemu-output
          JOBS: "4"
        run: bash scripts/build_pebble_qemu_host.sh 2>&1 | tee host-qemu-build.log

      - name: Import PBWs with production Java transport
        run: |
          set -o pipefail
          python3 scripts/java_installer_smoke.py \
            --qemu host-qemu-output/qemu-system-arm \
            --micro app/src/main/assets/pebble/basalt/qemu_micro_flash.bin \
            --base-spi .pebble-firmware-cache/basalt/qemu_spi_flash_base.bin \
            --watchfaces app/src/main/assets/watchfaces \
            --log java-installer-qemu.log \
            2>&1 | tee java-installer-smoke.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-pbw-import-smoke
          path: |
            host-qemu-build.log
            java-installer-smoke.log
            java-installer-qemu.log
          if-no-files-found: warn

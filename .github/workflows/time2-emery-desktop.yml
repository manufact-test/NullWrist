name: NullWrist Time 2 — upstream Emery smoke
on:
  push:
    branches: ["feature/time2-standalone"]
    paths:
      - "time2/scripts/m0_emery_desktop.sh"
      - "time2/upstream.lock.json"
      - ".github/workflows/time2-emery-desktop.yml"
  workflow_dispatch:

concurrency:
  group: time2-emery-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emery-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install documented PebbleOS build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison clang cmake flex gcc gcc-multilib gettext git gperf \
            libfreetype6-dev libglib2.0-dev libgtk-3-dev libncurses-dev \
            librsvg2-bin libsdl2-dev make nodejs openocd pkg-config \
            python3-dev python3-venv libpng-dev libasound2-dev libpulse-dev
      - name: Build upstream Emery and run real QEMU integration tests
        run: bash time2/scripts/m0_emery_desktop.sh
      - name: Upload M0 evidence, even if failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: time2-emery-desktop-m0
          path: time2/m0-results/
          if-no-files-found: warn
      - name: Upload hash-verified Emery development firmware images
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: time2-emery-desktop-firmware
          path: time2/m0-results/firmware/
          if-no-files-found: error

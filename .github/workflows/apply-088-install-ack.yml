name: Apply PutBytes install ACK correction

on:
  push:
    branches: ["feature/native-qemu-runtime"]
    paths: [".github/workflows/apply-088-install-ack.yml"]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/native-qemu-runtime
          fetch-depth: 0
      - name: Accept PebbleOS install ACK token
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/manufacttest/pebblereardisplay/runtime/PebbleAppInstaller.java')
          text = path.read_text()
          old = 'sendPutBytes(install.array(), cookie, partName + " install");'
          new = '''// Commit cleanup resets PebbleOS' active PutBytes token before the separate Install\n        // command is handled. A successful Install therefore responds with ACK token 0.\n        sendPutBytes(install.array(), 0, partName + " install");'''
          if old not in text:
              raise SystemExit('Expected install call not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/apply-088-install-ack.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/manufacttest/pebblereardisplay/runtime/PebbleAppInstaller.java .github/workflows/apply-088-install-ack.yml
          git commit -m "Accept PebbleOS token-zero Install ACK"
          git push origin HEAD:feature/native-qemu-runtime

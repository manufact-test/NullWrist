name: One-shot runtime UI acknowledgement patch

on:
  push:
    branches: ["feature/native-qemu-runtime"]
    paths:
      - "scripts/patch_runtime_ui_ack.py"
      - ".github/workflows/one-shot-runtime-ui-ack.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/native-qemu-runtime

      - name: Apply targeted MainActivity patch
        run: python3 scripts/patch_runtime_ui_ack.py

      - name: Remove one-shot patch machinery
        run: |
          rm scripts/patch_runtime_ui_ack.py
          rm .github/workflows/one-shot-runtime-ui-ack.yml

      - name: Commit runtime acknowledgement UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/manufacttest/pebblereardisplay/ui/MainActivity.java
          git add -u scripts/patch_runtime_ui_ack.py .github/workflows/one-shot-runtime-ui-ack.yml
          git commit -m "Show selected watchface as active only after runtime acknowledgement"
          git push origin HEAD:feature/native-qemu-runtime

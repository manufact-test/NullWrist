name: Apply Pebblehertz 0.8.9 fixes

on:
  push:
    branches: ["feature/minor-fixes-0.8.9"]
    paths:
      - "scripts/apply_089_minor_fixes.py"
      - ".github/workflows/apply-089-minor-fixes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/minor-fixes-0.8.9
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply source changes
        run: python3 scripts/apply_089_minor_fixes.py

      - name: Validate patch
        run: |
          git diff --check
          git status --short

      - name: Commit source changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "Pebblehertz 0.8.9 minor fixes"
          git push origin HEAD:feature/minor-fixes-0.8.9

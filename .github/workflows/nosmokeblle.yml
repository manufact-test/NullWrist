name: Build nosmokeblle PBW
on:
  push:
    branches: ["feature/nosmokeblle"]
    paths:
      - "pebble/nosmokeblle/**"
      - ".github/workflows/nosmokeblle.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Pebble tool
        run: |
          python -m pip install --upgrade pip
          pip install pebble-tool
      - name: Install SDK
        run: |
          pebble sdk install latest
          pebble sdk activate 4.33.1
          pebble --version
      - name: Build PBW
        working-directory: pebble/nosmokeblle
        env:
          PEBBLE_DISABLE_MEMORY_REPORT: "1"
        run: |
          pebble clean || true
          pebble build
          test -f build/nosmokeblle.pbw
          unzip -l build/nosmokeblle.pbw
          unzip -l build/nosmokeblle.pbw | grep -q "emery/pebble-app.bin"
      - name: Upload PBW
        uses: actions/upload-artifact@v4
        with:
          name: nosmokeblle-pbw
          path: pebble/nosmokeblle/build/*.pbw
          if-no-files-found: error

name: Build current signed APK

on:
  push:
    branches: [main]
    paths: [".github/workflows/build-current-signed-apk.yml"]

permissions:
  contents: write

jobs:
  build-signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.0.13004108" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pebblehertz-release.jks"

      - name: Fetch build assets
        run: |
          python3 scripts/fetch_bundled_watchfaces.py
          PEBBLE_SDK_VERSION=4.17 python3 scripts/fetch_pebble_basalt_firmware.py

      - name: Test and assemble signed release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/pebblehertz-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:testDebugUnitTest :app:assembleRelease

      - name: Verify and prepare APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk Pebblehertz-0.8.10-updated.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: pebblehertz-0.8.10-updated-signed
          path: Pebblehertz-0.8.10-updated.apk
          if-no-files-found: error

      - name: Record run and remove temporary workflow
        run: |
          mkdir -p ci
          printf 'run_id=%s\nhead_sha=%s\nartifact=pebblehertz-0.8.10-updated-signed\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > ci/current-signed-run.txt
          rm .github/workflows/build-current-signed-apk.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/current-signed-run.txt .github/workflows/build-current-signed-apk.yml
          git commit -m "Record current signed APK build [skip ci]"
          git push origin HEAD:main

name: Apply stability-first runtime simplification

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/run-stability-first-simplifier.yml

permissions:
  contents: write

jobs:
  simplify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/0.8.10-reliable-runtime
          fetch-depth: 0

      - name: Apply reviewed simplification
        shell: bash
        run: |
          set +e
          base64 --decode .github/scripts/simplify-runtime.py.gz.b64 | gzip --decompress > /tmp/simplify-runtime.py
          python3 /tmp/simplify-runtime.py
          code=$?
          printf 'exit_code=%s\nrun_id=%s\n' "$code" "$GITHUB_RUN_ID" > .simplify-runtime-result.txt
          if [[ "$code" == "0" ]]; then
            rm -f .github/scripts/simplify-runtime.py.gz.b64
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Simplify Pebblehertz to one stable runtime"
          git push origin HEAD:agent/0.8.10-reliable-runtime
          exit "$code"

# Registered workflow trigger.

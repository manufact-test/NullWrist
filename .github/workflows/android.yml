name: Android build

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Fetch bundled watchfaces
        run: python3 scripts/fetch_bundled_watchfaces.py

      - name: Test and build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pebble-rear-display-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit pinned PBW assets
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
        run: |
          if [ -z "$(git status --porcelain -- app/src/main/assets/watchfaces)" ]; then
            echo "Bundled PBW assets are already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/watchfaces
          git commit -m "Bundle seven Pebble watchfaces"
          git push origin "HEAD:${GITHUB_REF_NAME}"

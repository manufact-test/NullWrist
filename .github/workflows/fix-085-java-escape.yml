name: Fix Pebblehertz 0.8.5 Java escape

on:
  push:
    branches: ["feature/native-qemu-runtime"]
    paths:
      - ".github/workflows/fix-085-java-escape.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Fix and commit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/manufacttest/pebblereardisplay/ui/MainActivity.java')
          text = path.read_text(encoding='utf-8')
          old = 'value.matches("\\d{1,2}:\\d{2}")'
          new = 'value.matches("\\\\d{1,2}:\\\\d{2}")'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one invalid Java regex, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/fix-085-java-escape.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Night Mode time parser escape"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

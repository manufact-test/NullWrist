name: Run Stage 1 stabilizer

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/run-stage1-stabilizer.yml

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/0.8.10-reliable-runtime
          fetch-depth: 0

      - name: Apply reviewed stabilization patch
        run: python3 .github/scripts/stabilize_stage1.py

      - name: Commit feature branch changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stabilize reliable runtime and schedule sleep"
          git push origin HEAD:agent/0.8.10-reliable-runtime

name: NullWrist Time 2 — isolated Android
on:
  push:
    branches: ["feature/time2-standalone"]
    paths: ["time2/**", ".github/workflows/time2-android.yml"]
  pull_request:
    paths: ["time2/**", ".github/workflows/time2-android.yml"]

permissions:
  contents: read

jobs:
  time2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: time2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Tests
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Build standalone debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: APK artifact (not a PebbleOS emulator yet)
        uses: actions/upload-artifact@v4
        with:
          name: nullwrist-time2-0.1.0-dev-debug
          path: time2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Apply Pebblehertz 0.8.7 SPI recovery

on:
  push:
    branches: ["feature/native-qemu-runtime"]
    paths:
      - "scripts/apply_087_spi_recovery.py"
      - ".github/workflows/apply-087-spi-recovery.yml"

concurrency:
  group: apply-pebblehertz-087-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply stale import recovery
        run: |
          python3 -m py_compile scripts/apply_087_spi_recovery.py
          python3 scripts/apply_087_spi_recovery.py

      - name: Commit clean source
        run: |
          rm scripts/apply_087_spi_recovery.py
          rm .github/workflows/apply-087-spi-recovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Recover stale imported apps without clearing user data"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

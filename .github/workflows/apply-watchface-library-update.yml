              "Switch all seven bundled faces",
              "Switch all fifteen bundled faces"
          )
          readme_path.write_text(readme, encoding="utf-8")

          third_path = root / "THIRD_PARTY_WATCHFACES.md"
          third = third_path.read_text(encoding="utf-8")
          rows = '''| `enigma-1.1.pbw` | Enigma | Neal Patel | 1.1 | basalt | [Appstore listing](https://apps.repebble.com/enigma_55558c2a44dad6b80f000088); SHA-256 `da99f076b039ec444d9d5cf1616bbff8a089cd1d8f1cba1276555f672abdad95` |
| `rosewright-a-5.1.0.pbw` | Rosewright A | drwrose | 5.1.0 | aplite, basalt, chalk, diorite, emery, gabbro | [Appstore listing](https://apps.repebble.com/rosewright-a_52997231129af73409000033); SHA-256 `5310ed3837eedeb87d1a6a20e14a44f6ed40aac879e28870182c1f57fd8892c0` |
| `electronika-5-1.0.pbw` | Electronika 5 | Watchface-Generator.de | 1.0 | legacy package; no `targetPlatforms` field | [Appstore listing](https://apps.repebble.com/electronika-5-soviet-russia-watch_542aae37072ba27db80000dc); SHA-256 `0794900890abfabfca59c51a47145fd763a6c8549774696d6e014d9a8d1cb186` |
| `darth-time-4.0.pbw` | Darth Time | TenaciousDev | 4.0 | aplite, basalt, chalk | [Appstore listing](https://apps.repebble.com/darth-time_55e9493720f24c8f2e0000b5); SHA-256 `851aecf86caee72499de819782d96b32ce1568541359a2890c95300869ce08cd` |
| `metro-watch-1.1.pbw` | Metro Watch | Marc Ferrandiz Borras | 1.1 | legacy package; no `targetPlatforms` field | [Appstore listing](https://apps.repebble.com/metro-watch_5303d8bc7097ac4d3e000359); SHA-256 `a617124a051d9afaf5304c2c63569290da79dd2016c97cd7b756942993db31e7` |
| `starfield-smooth-1.0.0.pbw` | Starfield Smooth | Chris Lewis | 1.0.0 | legacy package; no `targetPlatforms` field | [Appstore listing](https://apps.repebble.com/starfield-smooth_52cd48ecc296577c6c00002f); SHA-256 `90e269e42ae03236c405d5176d9690a7defc4441ea52ae0f300646ab8ec350e5` |
| `cmd-time-typed-1.1.pbw` | CMD Time Typed | Chris Lewis | 1.1 | aplite, basalt, chalk, diorite, emery | [Appstore listing](https://apps.repebble.com/cmd-time-typed_52e919c2ad615bf1a5000024); SHA-256 `e0bcb2fbf883ed87e8fedee2a5607c2208fcc394b5fc1a0d1b5560290e7e47cc` |
| `omega-seamaster-007-1.1.pbw` | Omega Seamaster 007 | Watchface-Generator.de | 1.1 | legacy package; no `targetPlatforms` field | [Appstore listing](https://apps.repebble.com/omega-seamaster-007_547218ce95f74c03ba00007f); normalized archive SHA-256 `a60e3a1bcb1359399afcaadad409fe689a497b694ef937f62d153214c80b5967` |
'''
          third = third.replace(
              "\nThe machine-readable source manifest is",
              "\n" + rows + "\nQuartz by Dalpek is excluded because its supplied PBW contains only Emery/Gabbro binaries and no Basalt build.\n\nThe machine-readable source manifest is"
          )
          third_path.write_text(third, encoding="utf-8")
          PY

      - name: Download and validate pinned PBWs
        run: python3 scripts/fetch_bundled_watchfaces.py

      - name: Verify Basalt compatibility and library size
        run: |
          python3 - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          entries = json.loads(Path("bundled-watchfaces.json").read_text())
          assert len(entries) == 15, len(entries)
          directory = Path("app/src/main/assets/watchfaces")
          files = sorted(directory.glob("*.pbw"))
          assert len(files) == 15, [item.name for item in files]
          for entry in entries:
              path = directory / entry["file"]
              with zipfile.ZipFile(path) as archive:
                  names = set(archive.namelist())
                  assert "basalt/manifest.json" in names or "manifest.json" in names, path
                  json.loads(archive.read("appinfo.json"))
              print(f"OK {entry['name']}: {path.stat().st_size} bytes")
          PY

      - name: Commit Pebblehertz 0.8.2 update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-watchface-library-update.yml
          git add -A
          git commit -m "Add eight Pebble Time faces and delay preview capture"
          git push origin HEAD:feature/native-qemu-runtime

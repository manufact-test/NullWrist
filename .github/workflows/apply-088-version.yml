name: Apply Pebblehertz 0.8.8 version

on:
  push:
    branches: ["feature/native-qemu-runtime"]
    paths: [".github/workflows/apply-088-version.yml"]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/native-qemu-runtime
          fetch-depth: 0
      - name: Bump version and remove migration workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/build.gradle.kts')
          text = path.read_text()
          text = text.replace('versionCode = 21', 'versionCode = 22')
          text = text.replace('versionName = "0.8.7"', 'versionName = "0.8.8"')
          path.write_text(text)
          PY
          rm .github/workflows/apply-088-version.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts .github/workflows/apply-088-version.yml
          git commit -m "Bump Pebblehertz to 0.8.8"
          git push origin HEAD:feature/native-qemu-runtime

                  "page_url": "https://apps.repebble.com/metro-watch_5303d8bc7097ac4d3e000359",
                  "download_url": "https://appstore-api.repebble.com/api/assets/pbw/549839b7835244be3c0000e0.pbw",
                  "prefer_download_url": True,
                  "sha256": "a617124a051d9afaf5304c2c63569290da79dd2016c97cd7b756942993db31e7"
              },

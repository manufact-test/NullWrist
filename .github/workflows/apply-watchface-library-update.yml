name: Apply Pebblehertz 0.8.2 library update

on:
  push:
    branches: ["feature/native-qemu-runtime"]
    paths: [".github/workflows/apply-watchface-library-update.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/native-qemu-runtime

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply source and workflow changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path.cwd()

          additions = [
              {
                  "file": "enigma-1.1.pbw",
                  "name": "Enigma",
                  "version": "1.1",
                  "page_url": "https://apps.repebble.com/enigma_55558c2a44dad6b80f000088",
                  "download_url": "https://appstore-api.repebble.com/api/assets/pbw/555c330defc72feb4100006e.pbw",
                  "prefer_download_url": True,
                  "sha256": "da99f076b039ec444d9d5cf1616bbff8a089cd1d8f1cba1276555f672abdad95"

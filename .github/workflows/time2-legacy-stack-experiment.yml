name: NullWrist Time 2 — optional legacy stack diagnostic (Emery)

on:
  push:
    branches: ["feature/time2-standalone"]
    paths:
      - ".github/workflows/time2-legacy-stack-experiment.yml"
      - "time2/scripts/experiment_emery_legacy_stack.py"
      - "time2/scripts/m0_emery_desktop.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-stack-qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install PebbleOS build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bison clang cmake flex gcc gcc-multilib gettext git gperf \
            libfreetype6-dev libglib2.0-dev libgtk-3-dev libncurses-dev librsvg2-bin \
            libsdl2-dev make nodejs openocd pkg-config python3-dev python3-venv \
            libpng-dev libasound2-dev libpulse-dev
      - name: Preflight source patch and shell
        run: |
          python3 -m py_compile time2/scripts/experiment_emery_legacy_stack.py
          bash -n time2/scripts/m0_emery_desktop.sh
      - name: Build experimental source firmware and verify Linux emulator smoke
        env:
          EMERY_LEGACY_STACK_EXPERIMENT: "1"
        run: bash time2/scripts/m0_emery_desktop.sh
      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: time2-legacy-stack-candidate-evidence
          path: time2/m0-results/
          if-no-files-found: warn
      - name: Upload candidate firmware if smoke passed
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: time2-legacy-stack-candidate-firmware
          path: time2/m0-results/firmware/
          if-no-files-found: error

name: Android build

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.0.13004108" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Fetch bundled watchfaces
        id: fetch-watchfaces
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/fetch_bundled_watchfaces.py 2>&1 | tee watchface-fetch.log

      - name: Upload watchface fetch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchface-fetch-log
          path: watchface-fetch.log
          if-no-files-found: warn

      - name: Stop after watchface fetch failure
        if: steps.fetch-watchfaces.outcome != 'success'
        run: exit 1

      - name: Test and build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug

      - name: Verify native arm64 library
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "lib/arm64-v8a/libpebble_runtime.so"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pebble-rear-display-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit pinned PBW assets
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
        run: |
          if [ -z "$(git status --porcelain -- app/src/main/assets/watchfaces)" ]; then
            echo "Bundled PBW assets are already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/watchfaces
          git commit -m "Bundle seven Pebble watchfaces"
          git push origin "HEAD:${GITHUB_REF_NAME}"

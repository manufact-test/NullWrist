name: Publish NullWrist 0.8.12 final

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'manufact-test/NullWrist'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.0.13004108" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Verify release metadata
        run: |
          set -euo pipefail
          grep -q 'versionCode = 30' app/build.gradle.kts
          grep -q 'versionName = "0.8.12"' app/build.gradle.kts
          test -f CHANGELOG_0.8.12.md
          test -f app/src/main/res/mipmap-nodpi/nullwrist_launcher.png
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/res/mipmap-nodpi/nullwrist_launcher.png').read_bytes()
          assert p.startswith(b'\x89PNG\r\n\x1a\n'), 'launcher icon is not a valid PNG stream'
          PY

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nullwrist-release.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/nullwrist-release.jks" \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.ANDROID_KEY_ALIAS }}" >/dev/null

      - name: Fetch pinned watchfaces
        run: python3 scripts/fetch_bundled_watchfaces.py

      - name: Verify pinned Pebble Time firmware
        env:
          PEBBLE_SDK_VERSION: "4.17"
        run: python3 scripts/fetch_pebble_basalt_firmware.py

      - name: Test and assemble signed release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/nullwrist-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:testDebugUnitTest :app:assembleRelease

      - name: Verify APK certificate and prepare asset
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            app/build/outputs/apk/release/app-release.apk \
            | tee release-certificate.txt
          cp app/build/outputs/apk/release/app-release.apk NullWrist-0.8.12.apk
          sha256sum NullWrist-0.8.12.apk | tee apk-sha256.txt

      - name: Remove one-shot publisher from main
        id: clean
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-0.8.12-final.yml
          git commit -m "Remove final 0.8.12 release publisher [skip ci]"
          git push origin HEAD:main
          echo "target_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish or update GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.clean.outputs.target_sha }}
        run: |
          set -euo pipefail
          if gh release view v0.8.12 >/dev/null 2>&1; then
            gh release upload v0.8.12 NullWrist-0.8.12.apk --clobber
            gh release edit v0.8.12 \
              --title "NullWrist 0.8.12 Beta" \
              --notes-file CHANGELOG_0.8.12.md \
              --prerelease
          else
            gh release create v0.8.12 NullWrist-0.8.12.apk \
              --target "$TARGET_SHA" \
              --title "NullWrist 0.8.12 Beta" \
              --notes-file CHANGELOG_0.8.12.md \
              --prerelease
          fi

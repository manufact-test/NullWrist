name: Apply Pebblehertz library update

on:
  push:
    branches: ["feature/native-qemu-runtime"]
    paths: [".github/workflows/apply-library-update.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/native-qemu-runtime
          fetch-depth: 0

      - name: Finalize watchface manifest and patch application sources
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import importlib.util
          import json
          import shutil
          import subprocess
          import sys
          import urllib.request
          from pathlib import Path

          root = Path.cwd()

          def replace_once(path: str, old: str, new: str) -> None:
              target = root / path
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          fetch_path = root / "scripts" / "fetch_bundled_watchfaces.py"
          spec = importlib.util.spec_from_file_location("fetch_bundled_watchfaces", fetch_path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)

          manifest_path = root / "bundled-watchfaces.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          by_name = {entry["name"]: entry for entry in manifest}
          by_name["Code CMD"]["download_url"] = (
              "https://appstore-api.repebble.com/api/assets/pbw/55de277d785abd44a4000073.pbw"
          )

          studio = by_name["Studio Clock"]
          studio_url = module.resolve_download_url(studio)
          temporary = root / ".studio-clock.pbw"
          request = urllib.request.Request(studio_url, headers={"User-Agent": module.USER_AGENT})
          with urllib.request.urlopen(request, timeout=120) as response, temporary.open("wb") as output:
              shutil.copyfileobj(response, output)
          module.validate_pbw(temporary, studio["name"])
          studio["download_url"] = studio_url
          studio["sha256"] = module.sha256(temporary)
          temporary.unlink()
          manifest_path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          replace_once(
              "app/src/main/java/com/manufacttest/pebblereardisplay/data/AppPreferences.java",
              '''    public void setSelectedWatchfaceId(String storageId) {
                  preferences.edit().putString(KEY_SELECTED_WATCHFACE, storageId).apply();
              }
          }
          ''',
              '''    public void setSelectedWatchfaceId(String storageId) {
                  preferences.edit().putString(KEY_SELECTED_WATCHFACE, storageId).apply();
              }

              public void clearSelectedWatchfaceId() {
                  preferences.edit().remove(KEY_SELECTED_WATCHFACE).apply();
              }
          }
          ''',
          )

          replace_once(
              "app/src/main/java/com/manufacttest/pebblereardisplay/data/WatchfaceRepository.java",
              "import android.content.Context;\n",
              "import android.content.Context;\nimport android.content.SharedPreferences;\n",
          )
          replace_once(
              "app/src/main/java/com/manufacttest/pebblereardisplay/data/WatchfaceRepository.java",
              '''    private static final String ASSET_DIRECTORY = "watchfaces";
              private static final String[] RETIRED_BUNDLED_FILES = {
          ''',
              '''    private static final String ASSET_DIRECTORY = "watchfaces";
              private static final String LIBRARY_PREFERENCES = "watchface_library";

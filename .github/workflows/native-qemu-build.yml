name: Native Pebble QEMU build

on:
  push:
    branches: ["feature/native-qemu-runtime"]
    paths:
      - "scripts/build_pebble_qemu_android.sh"
      - "scripts/patch_qemu_framebuffer.py"
      - "scripts/patch_qemu_basalt_only.py"
      - ".github/workflows/native-qemu-build.yml"
  workflow_dispatch:

concurrency:
  group: native-pebble-qemu-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-qemu-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: android-actions/setup-android@v3

      - name: Restore cross-built dependency cache
        uses: actions/cache@v4
        with:
          path: |
            .native-qemu-build/prefix
            .native-qemu-build/sources/zlib-1.3.1
            .native-qemu-build/sources/libffi-3.4.8
            .native-qemu-build/sources/pcre2-10.46
            .native-qemu-build/sources/glib-2.82.5
            .native-qemu-build/sources/pixman-0.44.2
          key: pebble-qemu-android-deps-v2-${{ runner.os }}-ndk28

      - name: Install Android NDK and host build tools
        run: |
          sdkmanager "ndk;28.0.13004108"
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool pkg-config ninja-build cmake \
            gettext bison flex gperf make git curl xz-utils file
          python -m pip install --upgrade "meson==1.7.0" ninja

      - name: Build Pebble QEMU for Android arm64
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.0.13004108
          QEMU_ANDROID_WORK_DIR: ${{ github.workspace }}/.native-qemu-build
          QEMU_ANDROID_OUTPUT_DIR: ${{ github.workspace }}/native-qemu-output
          JOBS: "4"
        run: |
          set -o pipefail
          bash scripts/build_pebble_qemu_android.sh 2>&1 | tee native-qemu-build.log

      - name: Upload native QEMU build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-qemu-build-log
          path: native-qemu-build.log
          if-no-files-found: warn

      - name: Upload Android arm64 Pebble QEMU
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pebble-qemu-android-arm64
          path: native-qemu-output/
          if-no-files-found: error

      - name: Pin native QEMU in Android app
        if: success() && github.event_name == 'push'
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp native-qemu-output/libpebble_qemu_exec.so \
            app/src/main/jniLibs/arm64-v8a/libpebble_qemu_exec.so
          if git diff --quiet -- app/src/main/jniLibs/arm64-v8a/libpebble_qemu_exec.so; then
            echo "Pinned QEMU binary is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/jniLibs/arm64-v8a/libpebble_qemu_exec.so
          git commit -m "Bundle Basalt-only native Pebble QEMU for arm64"
          git push origin "HEAD:${GITHUB_REF_NAME}"

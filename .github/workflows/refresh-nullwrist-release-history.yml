name: Refresh NullWrist release history

on:
  push:
    branches:
      - refresh-nullwrist-release-history
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write
  pull-requests: read

jobs:
  refresh:
    if: github.event_name == 'push' || github.event.pull_request.title == '[refresh-nullwrist-release-history]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update release titles, notes and APK asset names
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nullwrist-release-history"
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$RUNNER_TEMP/releases.json"

          jq -c '.[]' "$RUNNER_TEMP/releases.json" | while IFS= read -r release; do
            release_id="$(jq -r '.id' <<<"$release")"
            tag="$(jq -r '.tag_name' <<<"$release")"
            old_name="$(jq -r '.name // ""' <<<"$release")"
            jq -r '.body // ""' <<<"$release" > "$RUNNER_TEMP/old-body.txt"

            new_name="$(python3 -c 'import sys; value=sys.argv[1]; replacements=(("PebbleHertz","NullWrist"),("Pebblehertz","NullWrist"),("PEBBLEHERTZ","NULLWRIST"),("pebblehertz","nullwrist")); [None for old,new in replacements if not (value:=value.replace(old,new))]; print(value)' "$old_name")"

            python3 -c 'import sys; from pathlib import Path; source=Path(sys.argv[1]); destination=Path(sys.argv[2]); value=source.read_text(encoding="utf-8"); replacements=(("PebbleHertz","NullWrist"),("Pebblehertz","NullWrist"),("PEBBLEHERTZ","NULLWRIST"),("pebblehertz","nullwrist"));
          for old,new in replacements: value=value.replace(old,new)
          destination.write_text(value, encoding="utf-8")' "$RUNNER_TEMP/old-body.txt" "$RUNNER_TEMP/new-body.txt"

            if [[ "$new_name" != "$old_name" ]] || ! cmp -s "$RUNNER_TEMP/old-body.txt" "$RUNNER_TEMP/new-body.txt"; then
              jq -n \
                --arg name "$new_name" \
                --rawfile body "$RUNNER_TEMP/new-body.txt" \
                '{name: $name, body: $body}' > "$RUNNER_TEMP/release-patch.json"
              gh api --method PATCH \
                "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
                --input "$RUNNER_TEMP/release-patch.json" >/dev/null
            fi

            jq -c '.assets[]?' <<<"$release" | while IFS= read -r asset; do
              asset_id="$(jq -r '.id' <<<"$asset")"
              old_asset_name="$(jq -r '.name' <<<"$asset")"
              asset_api_url="$(jq -r '.url' <<<"$asset")"
              new_asset_name="$(python3 -c 'import sys; value=sys.argv[1]; replacements=(("PebbleHertz","NullWrist"),("Pebblehertz","NullWrist"),("PEBBLEHERTZ","NULLWRIST"),("pebblehertz","nullwrist"));
          for old,new in replacements: value=value.replace(old,new)
          print(value)' "$old_asset_name")"

              if [[ "$new_asset_name" == "$old_asset_name" ]]; then
                continue
              fi

              destination="$RUNNER_TEMP/nullwrist-release-history/$new_asset_name"
              curl --fail --location --silent --show-error \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/octet-stream" \
                "$asset_api_url" \
                --output "$destination"
              gh release upload "$tag" "$destination" --clobber
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" >/dev/null
            done
          done

      - name: Remove one-time workflow
        run: |
          set -euo pipefail
          rm .github/workflows/refresh-nullwrist-release-history.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/refresh-nullwrist-release-history.yml
          git commit -m "Finish NullWrist release history refresh [skip ci]"
          git push origin HEAD:main

name: Android build

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply pending Pebblehertz 0.8.4 migration
        if: github.event_name == 'push' && github.ref_name == 'feature/native-qemu-runtime' && hashFiles('scripts/apply_v084_ui.py') != ''
        run: |
          python3 scripts/apply_v084_ui.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finish Pebblehertz 0.8.4 power UI and native TCG"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.0.13004108" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Fetch bundled watchfaces
        id: fetch-watchfaces
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/fetch_bundled_watchfaces.py 2>&1 | tee watchface-fetch.log

      - name: Upload watchface fetch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchface-fetch-log
          path: watchface-fetch.log
          if-no-files-found: warn

      - name: Stop after watchface fetch failure
        if: steps.fetch-watchfaces.outcome != 'success'
        run: exit 1

      - name: Fetch official Pebble Basalt firmware
        id: fetch-firmware
        continue-on-error: true
        env:
          PEBBLE_SDK_VERSION: "4.17"
        run: |
          set -o pipefail
          python3 scripts/fetch_pebble_basalt_firmware.py 2>&1 | tee basalt-firmware-fetch.log

      - name: Upload Basalt firmware fetch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basalt-firmware-fetch-log
          path: basalt-firmware-fetch.log
          if-no-files-found: warn

      - name: Stop after firmware fetch failure
        if: steps.fetch-firmware.outcome != 'success'
        run: exit 1

      - name: Test and build debug APK
        id: android-build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee android-build.log

      - name: Upload Android build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android-build.log
          if-no-files-found: warn

      - name: Stop after Android build failure
        if: steps.android-build.outcome != 'success'
        run: exit 1

      - name: Verify native runtime and firmware assets
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "lib/arm64-v8a/libpebble_runtime.so"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "lib/arm64-v8a/libpebble_qemu_exec.so"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "assets/pebble/basalt/qemu_micro_flash.bin"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "assets/pebble/basalt/qemu_spi_flash.bin"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pebble-rear-display-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit pinned runtime assets
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
        run: |
          if [ -z "$(git status --porcelain -- app/src/main/assets/watchfaces app/src/main/assets/pebble)" ]; then
            echo "Bundled PBW and Pebble firmware assets are already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/watchfaces app/src/main/assets/pebble
          git commit -m "Bundle watchfaces and Basalt emulator firmware"
          git push origin "HEAD:${GITHUB_REF_NAME}"

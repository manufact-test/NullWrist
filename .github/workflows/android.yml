name: Android build

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.0.13004108" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Apply pending Pebblehertz library update
        id: migration
        if: hashFiles('scripts/apply_library_update.py') != ''
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/apply_library_update.py 2>&1 | tee migration.log

      - name: Upload library migration log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-migration-log
          path: migration.log
          if-no-files-found: warn

      - name: Stop after library migration failure
        if: steps.migration.outcome == 'failure'
        run: exit 1

      - name: Fetch bundled watchfaces
        id: fetch-watchfaces
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/fetch_bundled_watchfaces.py 2>&1 | tee watchface-fetch.log

      - name: Upload watchface fetch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchface-fetch-log
          path: watchface-fetch.log
          if-no-files-found: warn

      - name: Stop after watchface fetch failure
        if: steps.fetch-watchfaces.outcome != 'success'
        run: exit 1

      - name: Fetch official Pebble Basalt firmware
        id: fetch-firmware
        continue-on-error: true
        env:
          PEBBLE_SDK_VERSION: "4.17"
        run: |
          set -o pipefail
          python3 scripts/fetch_pebble_basalt_firmware.py 2>&1 | tee basalt-firmware-fetch.log

      - name: Upload Basalt firmware fetch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basalt-firmware-fetch-log
          path: basalt-firmware-fetch.log
          if-no-files-found: warn

      - name: Stop after firmware fetch failure
        if: steps.fetch-firmware.outcome != 'success'
        run: exit 1

      - name: Test and build debug APK
        id: android-build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee android-build.log

      - name: Upload Android build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android-build.log
          if-no-files-found: warn

      - name: Stop after Android build failure
        if: steps.android-build.outcome != 'success'
        run: exit 1

      - name: Verify native runtime and firmware assets
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "lib/arm64-v8a/libpebble_runtime.so"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "lib/arm64-v8a/libpebble_qemu_exec.so"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "assets/pebble/basalt/qemu_micro_flash.bin"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "assets/pebble/basalt/qemu_spi_flash.bin"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pebble-rear-display-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit pinned runtime assets and library update
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
        run: |
          paths=(
            bundled-watchfaces.json
            app/src/main/assets/watchfaces
            app/src/main/assets/pebble
            app/src/main/java/com/manufacttest/pebblereardisplay/data/AppPreferences.java
            app/src/main/java/com/manufacttest/pebblereardisplay/data/WatchfaceRepository.java
            app/src/main/java/com/manufacttest/pebblereardisplay/data/WatchfaceThumbnailRepository.java
            app/src/main/java/com/manufacttest/pebblereardisplay/runtime/PebbleRuntimeService.java
            app/src/main/java/com/manufacttest/pebblereardisplay/ui/MainActivity.java
            .github/workflows/android.yml
            .github/workflows/apply-library-update.yml
            scripts/apply_library_update.py
          )
          if [ -z "$(git status --porcelain -- "${paths[@]}")" ]; then
            echo "Bundled assets and application sources are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            bundled-watchfaces.json \
            app/src/main/assets/watchfaces \
            app/src/main/assets/pebble \
            app/src/main/java/com/manufacttest/pebblereardisplay/data/AppPreferences.java \
            app/src/main/java/com/manufacttest/pebblereardisplay/data/WatchfaceRepository.java \
            app/src/main/java/com/manufacttest/pebblereardisplay/data/WatchfaceThumbnailRepository.java \
            app/src/main/java/com/manufacttest/pebblereardisplay/runtime/PebbleRuntimeService.java \
            app/src/main/java/com/manufacttest/pebblereardisplay/ui/MainActivity.java \
            .github/workflows/android.yml
          git add -u -- \
            .github/workflows/apply-library-update.yml \
            scripts/apply_library_update.py
          git commit -m "Add removable watchface library and settled previews"
          git push origin "HEAD:${GITHUB_REF_NAME}"

              for (File file : files) {
          ''',
              '''        File[] files = watchfaceDirectory.listFiles();
              if (files == null) {
                  return;
              }
              Set<String> hiddenBundled = hiddenBundledStorageIds();
              for (File file : files) {
          ''',
          )
          replace_once(
              "app/src/main/java/com/manufacttest/pebblereardisplay/data/WatchfaceRepository.java",
              '''                || !file.getName().toLowerCase(Locale.ROOT).endsWith(".pbw")
                          || seenStorageIds.contains(file.getName())) {
          ''',
              '''                || !file.getName().toLowerCase(Locale.ROOT).endsWith(".pbw")
                          || seenStorageIds.contains(file.getName())
                          || hiddenBundled.contains(file.getName())) {
          ''',
          )
          replace_once(
              "app/src/main/java/com/manufacttest/pebblereardisplay/data/WatchfaceRepository.java",
              '''    private void removeRetiredBundledFiles() {
          ''',
              '''    private Set<String> hiddenBundledStorageIds() {
                  SharedPreferences preferences = context.getSharedPreferences(
                          LIBRARY_PREFERENCES,
                          Context.MODE_PRIVATE
                  );
                  Set<String> stored = preferences.getStringSet(KEY_HIDDEN_BUNDLED, null);
                  return stored == null ? new HashSet<>() : new HashSet<>(stored);
              }

              private void removeRetiredBundledFiles() {
          ''',
          )

          replace_once(
              "app/src/main/java/com/manufacttest/pebblereardisplay/data/WatchfaceThumbnailRepository.java",
              '''    private static final String ASSET_DIRECTORY = "watchface-thumbnails";
              private static final String FILE_DIRECTORY = "watchface-thumbnails";
          ''',

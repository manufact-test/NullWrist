name: Apply Pebblehertz 0.8.6 import fix

on:
  push:
    branches: ["feature/native-qemu-runtime"]
    paths:
      - "scripts/apply_086_import_fix.py"
      - ".github/workflows/apply-086-import-fix.yml"

concurrency:
  group: apply-pebblehertz-086-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply import completion repair
        run: |
          python3 -m py_compile scripts/apply_086_import_fix.py
          python3 scripts/apply_086_import_fix.py

      - name: Commit clean source
        run: |
          rm scripts/apply_086_import_fix.py
          rm .github/workflows/apply-086-import-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix imported PBW completion after AppFetch"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

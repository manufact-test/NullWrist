name: orangre piano — Android release

on:
  push:
    branches: ["orangre-piano/**"]
    paths:
      - "orangre-piano/**"
      - ".github/workflows/orangre-piano.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orangre-piano-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orangre-piano
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build and lint both variants
        run: gradle :app:assembleStandardDebug :app:lintStandardDebug :app:assembleBadgesDebug :app:lintBadgesDebug --stacktrace

      - name: Verify both variants and distinct permissions
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          SAFE="app/build/outputs/apk/standard/debug/app-standard-debug.apk"
          BADGES="app/build/outputs/apk/badges/debug/app-badges-debug.apk"
          for APK in "$SAFE" "$BADGES"; do
            test -s "$APK"
            "$SIGNER" verify --verbose "$APK"
            "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/$(basename "$APK").badging"
            "$AAPT" dump xmltree "$APK" AndroidManifest.xml > "$RUNNER_TEMP/$(basename "$APK").manifest"
            grep -q "package: name='com.orangrepiano.launcher'" "$RUNNER_TEMP/$(basename "$APK").badging"
            grep -q "targetSdkVersion:'36'" "$RUNNER_TEMP/$(basename "$APK").badging"
            grep -q "application-icon-" "$RUNNER_TEMP/$(basename "$APK").badging"
          done
          if grep -Eq 'BIND_NOTIFICATION_LISTENER_SERVICE|PianoNotificationListener' "$RUNNER_TEMP/app-standard-debug.apk.manifest"; then
            echo "::error::Standard install must not request notification listener access!"
            exit 1
          fi
          grep -q 'BIND_NOTIFICATION_LISTENER_SERVICE' "$RUNNER_TEMP/app-badges-debug.apk.manifest"
          grep -q 'PianoNotificationListener' "$RUNNER_TEMP/app-badges-debug.apk.manifest"
          echo "Both APKs verified: standard has no notification listener, badges declares it."

      - uses: actions/upload-artifact@v4
        with:
          name: orangre-piano-1.1.2-rc1-standard-apk
          path: orangre-piano/app/build/outputs/apk/standard/debug/app-standard-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: orangre-piano-1.1.2-rc1-badges-apk
          path: orangre-piano/app/build/outputs/apk/badges/debug/app-badges-debug.apk
          if-no-files-found: error

      - name: Prepare protected production signing
        env:
          PIANO_KEYSTORE_B64: ${{ secrets.PIANO_KEYSTORE_B64 }}
          PIANO_STORE_PASSWORD: ${{ secrets.PIANO_STORE_PASSWORD }}
          PIANO_KEY_ALIAS: ${{ secrets.PIANO_KEY_ALIAS }}
          PIANO_KEY_PASSWORD: ${{ secrets.PIANO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$PIANO_KEYSTORE_B64" && -n "$PIANO_STORE_PASSWORD" && -n "$PIANO_KEY_ALIAS" && -n "$PIANO_KEY_PASSWORD" ]]; then
            umask 077
            printf '%s' "$PIANO_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/orangre-piano-release.jks"
            keytool -list -keystore "$RUNNER_TEMP/orangre-piano-release.jks" \
              -storepass "$PIANO_STORE_PASSWORD" -alias "$PIANO_KEY_ALIAS" >/dev/null
            echo "PIANO_RELEASE_READY=true" >> "$GITHUB_ENV"
          else
            echo "PIANO_RELEASE_READY=false" >> "$GITHUB_ENV"
            echo "::notice::No protected signing key configured. Publishing a debug-signed release candidate, not a Play Store release."
          fi

      - name: Build signed production APK and AAB
        if: env.PIANO_RELEASE_READY == 'true'
        env:
          PIANO_KEYSTORE_PATH: ${{ runner.temp }}/orangre-piano-release.jks
          PIANO_STORE_PASSWORD: ${{ secrets.PIANO_STORE_PASSWORD }}
          PIANO_KEY_ALIAS: ${{ secrets.PIANO_KEY_ALIAS }}
          PIANO_KEY_PASSWORD: ${{ secrets.PIANO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle :app:assembleStandardRelease :app:bundleStandardRelease --stacktrace
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/standard/release/app-standard-release.apk
          test -s app/build/outputs/bundle/standardRelease/app-standard-release.aab

      - name: Upload production deliverables
        if: env.PIANO_RELEASE_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: orangre-piano-v1.1.2-signed-release
          path: |
            orangre-piano/app/build/outputs/apk/standard/release/app-standard-release.apk
            orangre-piano/app/build/outputs/bundle/standardRelease/app-standard-release.aab
          if-no-files-found: error

      - name: Publish GitHub preview or signed release
        if: github.ref == 'refs/heads/orangre-piano/dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$PIANO_RELEASE_READY" == "true" ]]; then
            TAG="orangre-piano-v1.1.2"
            cp app/build/outputs/apk/standard/release/app-standard-release.apk ../orangre-piano-v1.1.2.apk
            cp app/build/outputs/bundle/standardRelease/app-standard-release.aab ../orangre-piano-v1.1.2.aab
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$TAG" ../orangre-piano-v1.1.2.apk ../orangre-piano-v1.1.2.aab --clobber --repo "$GITHUB_REPOSITORY"
            else
              gh release create "$TAG" ../orangre-piano-v1.1.2.apk ../orangre-piano-v1.1.2.aab \
                --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
                --title "orangre piano 1.1.2 — ATELIER" \
                --notes "Signed standard build, no sensitive notification listener. Compact one-line weather, round coin icon, three-dot settings. Badge-enabled developer edition is built as a separate opt-in variant and is not included as the standard Play release."
            fi
          else
            TAG="orangre-piano-v1.1.2-rc1"
            cp app/build/outputs/apk/standard/debug/app-standard-debug.apk ../orangre-piano-v1.1.2-rc1.apk
            cp app/build/outputs/apk/badges/debug/app-badges-debug.apk ../orangre-piano-v1.1.2-badges-rc1.apk
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$TAG" ../orangre-piano-v1.1.2-rc1.apk ../orangre-piano-v1.1.2-badges-rc1.apk --clobber --repo "$GITHUB_REPOSITORY"
            else
              gh release create "$TAG" ../orangre-piano-v1.1.2-rc1.apk ../orangre-piano-v1.1.2-badges-rc1.apk \
                --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
                --title "orangre piano 1.1.2 RC1 — ATELIER" \
                --notes "Two build variants. STANDARD: orangre-piano-v1.1.2-rc1.apk, intended for direct install; no sensitive notification access. BADGES: orangre-piano-v1.1.2-badges-rc1.apk, implements real app notification counts and requests Android notification listener access only with explicit user consent. Google's Play Protect may automatically block internet-sideloading the BADGES APK; for development it can be deployed via Android Debug Bridge (ADB) over USB. Do not disable Play Protect. Both builds have smaller one-line weather, the round coin button and three-dot settings. Badges show 1-99+ only when active notifications exist. Builds use temporary debug signatures, so installing over previous versions generally requires uninstall. Signed production requires protected secrets." \
                --prerelease
            fi
          fi

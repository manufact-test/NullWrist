              "Quartz by Dalpek is not bundled because the supplied PBW contains only Emery/Gabbro builds and no Basalt executable.\n\n"
              "### 0.8.1 runtime repair\n"
          )
          readme = readme.replace(
              "- polvtorogo 0.1.1\n",
              "- polvtorogo 0.1.1\n"

name: Publish Pebblehertz release

on:
  workflow_dispatch:
  push:
    branches:
      - feature/minor-fixes-0.8.9
    paths:
      - .github/workflows/release.yml
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.0.13004108" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pebble-rear-display-release.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/pebble-rear-display-release.jks" \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.ANDROID_KEY_ALIAS }}" >/dev/null

      - name: Fetch pinned watchfaces
        run: python3 scripts/fetch_bundled_watchfaces.py

      - name: Verify pinned Pebble Time firmware
        env:
          PEBBLE_SDK_VERSION: "4.17"
        run: python3 scripts/fetch_pebble_basalt_firmware.py

      - name: Test and assemble signed release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/pebble-rear-display-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:testDebugUnitTest :app:assembleRelease

      - name: Verify APK certificate
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            app/build/outputs/apk/release/app-release.apk \
            | tee release-certificate.txt

      - name: Prepare release files
        run: cp app/build/outputs/apk/release/app-release.apk Pebblehertz-0.8.9.apk

      - name: Upload signed build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pebblehertz-0.8.9-signed-release
          path: |
            Pebblehertz-0.8.9.apk
            release-certificate.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.8.9
          target_commitish: ${{ github.sha }}
          name: Pebblehertz 0.8.9 Beta
          prerelease: true
          make_latest: true
          fail_on_unmatched_files: true
          files: Pebblehertz-0.8.9.apk
          body: |
            Pebble watchfaces on the rear display of the Unihertz Titan 2 — no root required.

            ## What is new in 0.8.9

            - Sleep Schedule now uses Android's native 24-hour time picker.
            - Duplicate PBW imports are blocked by Pebble UUID.
            - The Titan 2 battery percentage and charging state are forwarded to PebbleOS.
            - Runtime status notifications have been removed from the Android notification shade.
            - Notification permission is still requested for future Pebble notification features.
            - A new support dialog includes Wise and PayPal options.

            ## Important installation note

            If you installed or tested Pebblehertz before July 21, 2026, uninstall the old version before installing 0.8.9. Future versions can be installed normally over this release.

            This is a beta release intended for the Unihertz Titan 2.

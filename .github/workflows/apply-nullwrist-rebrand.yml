name: Apply NullWrist rebrand

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: write

jobs:
  rebrand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Apply deterministic rebrand
        run: python3 scripts/rebrand_nullwrist.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.0.13004108" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Fetch pinned watchfaces
        run: python3 scripts/fetch_bundled_watchfaces.py

      - name: Verify pinned Pebble Time firmware
        env:
          PEBBLE_SDK_VERSION: "4.17"
        run: python3 scripts/fetch_pebble_basalt_firmware.py

      - name: Run tests and assemble debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug

      - name: Verify rebrand diff
        run: |
          set -euo pipefail
          git clean -fdX
          test -f CHANGELOG_0.8.11.md
          test -f docs/nullwrist-icon.svg
          test -f app/src/main/java/com/manufacttest/pebblereardisplay/NullWristApplication.java
          test ! -e app/src/main/java/com/manufacttest/pebblereardisplay/PebblehertzApplication.java
          ! git grep -I -n -E 'Pebblehertz|PebbleHertz|PEBBLEHERTZ|pebblehertz'
          git diff --check
          git status --short

      - name: Commit verified rebrand
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebrand application as NullWrist"
          git push origin HEAD:main

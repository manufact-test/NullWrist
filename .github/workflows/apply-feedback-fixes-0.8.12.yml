name: Apply NullWrist 0.8.12 feedback fixes

on:
  push:
    branches: ["feature/feedback-fixes-0.8.12"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/feedback-fixes-0.8.12
          fetch-depth: 0

      - name: Apply launcher and runtime reliability fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one anchor in {path}, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Version bump for the feedback-fix build.
          replace_once(
              "app/build.gradle.kts",
              '        versionCode = 28\n        versionName = "0.8.11"',
              '        versionCode = 29\n        versionName = "0.8.12"'
          )

          # Android launcher icons: use proper mipmap + adaptive icon resources.
          replace_once(
              "app/src/main/AndroidManifest.xml",
              '        android:icon="@drawable/ic_launcher"\n        android:label="@string/app_name"',
              '        android:icon="@mipmap/ic_launcher"\n        android:label="@string/app_name"\n        android:roundIcon="@mipmap/ic_launcher_round"'
          )

          legacy_icon = '''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp"
              android:height="48dp"
              android:viewportWidth="48"
              android:viewportHeight="48">
              <path android:fillColor="#0E1720" android:pathData="M0,0h48v48h-48z" />
              <path android:fillColor="#52E0C4" android:pathData="M17,4h14v3h-14zM17,41h14v3h-14zM7,17h3v14h-3zM38,17h3v14h-3z" />
              <path android:fillColor="#1D2A36" android:pathData="M15,8h18v3h4v26h-4v3h-18v-3h-4v-26h4z" />
              <path android:fillColor="#FFF7DF" android:pathData="M15,12h18v24h-18z" />
              <path android:fillColor="#17202A" android:pathData="M24,16a8,8 0,1 0,0 16a8,8 0,1 0,0 -16" />
              <path android:fillColor="#FFF7DF" android:pathData="M24,20a4,4 0,1 0,0 8a4,4 0,1 0,0 0,-8" />
              <path android:fillColor="#FF665A" android:pathData="M17,30l12,-14h4l-12,14z" />
              <path android:fillColor="#17202A" android:pathData="M17,14h3v2h-3zM28,32h3v2h-3z" />
          </vector>
          '''.replace("          ", "")

          foreground_icon = '''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <group
                  android:scaleX="1.35"
                  android:scaleY="1.35"
                  android:translateX="21.6"
                  android:translateY="21.6">
                  <path android:fillColor="#52E0C4" android:pathData="M17,4h14v3h-14zM17,41h14v3h-14zM7,17h3v14h-3zM38,17h3v14h-3z" />
                  <path android:fillColor="#1D2A36" android:pathData="M15,8h18v3h4v26h-4v3h-18v-3h-4v-26h4z" />
                  <path android:fillColor="#FFF7DF" android:pathData="M15,12h18v24h-18z" />
                  <path android:fillColor="#17202A" android:pathData="M24,16a8,8 0,1 0,0 16a8,8 0,1 0,0 -16" />
                  <path android:fillColor="#FFF7DF" android:pathData="M24,20a4,4 0,1 0,0 8a4,4 0,1 0,0 0,-8" />
                  <path android:fillColor="#FF665A" android:pathData="M17,30l12,-14h4l-12,14z" />
                  <path android:fillColor="#17202A" android:pathData="M17,14h3v2h-3zM28,32h3v2h-3z" />
              </group>
          </vector>
          '''.replace("          ", "")

          background_icon = '''<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#0E1720" />
          </shape>
          '''.replace("          ", "")

          adaptive_icon = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          '''.replace("          ", "")

          Path("app/src/main/res/drawable/ic_launcher_foreground.xml").write_text(foreground_icon, encoding="utf-8")
          Path("app/src/main/res/drawable/ic_launcher_background.xml").write_text(background_icon, encoding="utf-8")
          Path("app/src/main/res/mipmap-anydpi").mkdir(parents=True, exist_ok=True)
          Path("app/src/main/res/mipmap-anydpi-v26").mkdir(parents=True, exist_ok=True)
          Path("app/src/main/res/mipmap-anydpi/ic_launcher.xml").write_text(legacy_icon, encoding="utf-8")
          Path("app/src/main/res/mipmap-anydpi/ic_launcher_round.xml").write_text(legacy_icon, encoding="utf-8")
          Path("app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml").write_text(adaptive_icon, encoding="utf-8")
          Path("app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml").write_text(adaptive_icon, encoding="utf-8")

          qemu = "app/src/main/java/com/manufacttest/pebblereardisplay/runtime/PebbleQemuProcess.java"
          replace_once(
              qemu,
              '    private static final String KEY_088_RECOVERY_COMPLETED = "recovery_088_completed";\n',
              '    private static final String KEY_088_RECOVERY_COMPLETED = "recovery_088_completed";\n'
              '    private static final long STALE_QEMU_TERM_WAIT_MILLIS = 900L;\n'
              '    private static final long STALE_QEMU_KILL_WAIT_MILLIS = 500L;\n'
              '    private static final long STALE_QEMU_POLL_MILLIS = 25L;\n'
          )

          reset_method = '''    /**
           * Rebuilds PebbleOS-owned persistent state without deleting imported PBW files.
           * Used only after repeated runtime failures, once the active QEMU has been discarded.
           */
          public synchronized void resetPersistentStateForRecovery() throws IOException {
              if (isRunning()) {
                  throw new IOException("Cannot reset PebbleOS state while QEMU is running");
              }
              terminateStaleQemuProcess();
              closeFramebufferReader();
              copyAsset(ASSET_ROOT + "qemu_spi_flash.bin", spiFlash, true);
              new InstalledWatchfaceRegistry(context).clear();
              if (framebuffer.exists() && !framebuffer.delete()) {
                  throw new IOException("Cannot reset Pebble framebuffer");
              }
              if (frameEventPipe.exists() && !frameEventPipe.delete()) {
                  throw new IOException("Cannot reset Pebble framebuffer event pipe");
              }
              if (pidFile.exists() && !pidFile.delete()) {
                  throw new IOException("Cannot reset QEMU PID file");
              }
          }

          '''.replace("          ", "")
          replace_once(
              qemu,
              '    public boolean waitForFirstFrame(long timeoutMillis) throws InterruptedException {\n',
              reset_method + '    public boolean waitForFirstFrame(long timeoutMillis) throws InterruptedException {\n'
          )

          old_stale = '''    private void terminateStaleQemuProcess() {
              if (!pidFile.isFile()) {
                  return;
              }
              int stalePid;
              try {
                  String value = new String(
                          Files.readAllBytes(pidFile.toPath()),
                          StandardCharsets.US_ASCII
                  ).trim();
                  stalePid = Integer.parseInt(value);
              } catch (IOException | NumberFormatException ignored) {
                  return;
              }
              if (stalePid <= 0 || stalePid == qemuPid || !isPebbleQemuProcess(stalePid)) {
                  return;
              }
              try {
                  Os.kill(stalePid, OsConstants.SIGTERM);
              } catch (ErrnoException ignored) {
                  return;
              }
              for (int attempt = 0; attempt < 10; attempt++) {
                  if (!new File("/proc/" + stalePid).exists()) {
                      return;
                  }
                  try {
                      Thread.sleep(30L);
                  } catch (InterruptedException interrupted) {
                      Thread.currentThread().interrupt();
                      return;
                  }
              }
              try {
                  Os.kill(stalePid, OsConstants.SIGKILL);
              } catch (ErrnoException ignored) {
              }
          }

          private static boolean isPebbleQemuProcess(int pid) {
              try {
                  String command = new String(
                          Files.readAllBytes(new File("/proc/" + pid + "/cmdline").toPath()),
                          StandardCharsets.UTF_8
                  );
                  return command.contains("libpebble_qemu_exec.so")
                          || command.contains("pebble-qemu-launcher");
              } catch (IOException ignored) {
                  return false;
              }
          }
          '''.replace("          ", "")

          new_stale = '''    private void terminateStaleQemuProcess() throws IOException {
              if (!pidFile.isFile()) {
                  return;
              }

              int stalePid = readStaleQemuPid();
              if (stalePid <= 0) {
                  return;
              }
              if (stalePid == android.os.Process.myPid() || stalePid == qemuPid) {
                  return;
              }

              ProcessIdentity identity = inspectPebbleQemuProcess(stalePid);
              if (identity == ProcessIdentity.DIFFERENT_PROCESS) {
                  return;
              }

              // Android may hide /proc/<pid>/cmdline on OEM builds. The PID file is app-private,
              // and the kernel only lets this app signal its own UID/process family. If identity
              // is unknown but signal 0 succeeds, treating the PID as our orphan is safer than
              // starting a second QEMU on the same SPI flash and framebuffer files.
              if (!canSignalProcess(stalePid)) {
                  return;
              }
              if (!sendSignal(stalePid, OsConstants.SIGTERM)) {
                  return;
              }
              if (waitForProcessExit(stalePid, STALE_QEMU_TERM_WAIT_MILLIS)) {
                  return;
              }

              ProcessIdentity beforeKill = inspectPebbleQemuProcess(stalePid);
              if (beforeKill == ProcessIdentity.DIFFERENT_PROCESS) {
                  return;
              }
              if (!sendSignal(stalePid, OsConstants.SIGKILL)) {
                  return;
              }
              if (!waitForProcessExit(stalePid, STALE_QEMU_KILL_WAIT_MILLIS)) {
                  throw new IOException(
                          "Refusing to start a second QEMU while stale process "
                                  + stalePid
                                  + " is still alive"
                  );
              }
          }

          private int readStaleQemuPid() {
              try {
                  String value = new String(
                          Files.readAllBytes(pidFile.toPath()),
                          StandardCharsets.US_ASCII
                  ).trim();
                  return Integer.parseInt(value);
              } catch (IOException | NumberFormatException ignored) {
                  return -1;
              }
          }

          private static ProcessIdentity inspectPebbleQemuProcess(int pid) {
              try {
                  String command = new String(
                          Files.readAllBytes(new File("/proc/" + pid + "/cmdline").toPath()),
                          StandardCharsets.UTF_8
                  );
                  if (command.isBlank()) {
                      return ProcessIdentity.UNKNOWN;
                  }
                  return command.contains("libpebble_qemu_exec.so")
                                  || command.contains("pebble-qemu-launcher")
                          ? ProcessIdentity.PEBBLE_QEMU
                          : ProcessIdentity.DIFFERENT_PROCESS;
              } catch (IOException ignored) {
                  return ProcessIdentity.UNKNOWN;
              }
          }

          private static boolean canSignalProcess(int pid) throws IOException {
              try {
                  Os.kill(pid, 0);
                  return true;
              } catch (ErrnoException error) {
                  if (error.errno == OsConstants.ESRCH || error.errno == OsConstants.EPERM) {
                      return false;
                  }
                  throw new IOException("Could not inspect stale PebbleOS process " + pid, error);
              }
          }

          private static boolean sendSignal(int pid, int signal) throws IOException {
              try {
                  Os.kill(pid, signal);
                  return true;
              } catch (ErrnoException error) {
                  if (error.errno == OsConstants.ESRCH || error.errno == OsConstants.EPERM) {
                      return false;
                  }
                  throw new IOException("Could not stop stale PebbleOS process " + pid, error);
              }
          }

          private static boolean waitForProcessExit(int pid, long timeoutMillis)
                  throws IOException {
              long deadline = System.nanoTime() + TimeUnit.MILLISECONDS.toNanos(timeoutMillis);
              while (System.nanoTime() < deadline) {
                  if (!canSignalProcess(pid)) {
                      return true;
                  }
                  try {
                      Thread.sleep(STALE_QEMU_POLL_MILLIS);
                  } catch (InterruptedException interrupted) {
                      Thread.currentThread().interrupt();
                      throw new IOException(
                              "Interrupted while stopping stale PebbleOS process",
                              interrupted
                      );
                  }
              }
              return !canSignalProcess(pid);
          }

          private enum ProcessIdentity {
              PEBBLE_QEMU,
              DIFFERENT_PROCESS,
              UNKNOWN
          }
          '''.replace("          ", "")
          replace_once(qemu, old_stale, new_stale)

          service = "app/src/main/java/com/manufacttest/pebblereardisplay/runtime/PebbleRuntimeService.java"
          replace_once(
              service,
              '    private static final long RECOVERY_DELAY_MILLIS = 1_500L;\n',
              '    private static final long RECOVERY_DELAY_MILLIS = 1_500L;\n'
              '    private static final int STATE_RESET_FAILURE_THRESHOLD = 2;\n'
              '    private static final int MAX_AUTOMATIC_FAILURES = 5;\n'
          )
          replace_once(
              service,
              '    private volatile int consecutiveFailures;\n',
              '    private volatile int consecutiveFailures;\n'
              '    private volatile boolean persistentRecoveryPerformed;\n'
              '    private volatile boolean automaticRecoveryPaused;\n'
          )
          replace_once(
              service,
              '            if (shouldHaveRuntime()) {\n                PebbleQemuProcess current = runtime;',
              '            if (shouldHaveRuntime() && !automaticRecoveryPaused) {\n                PebbleQemuProcess current = runtime;'
          )

          old_on_start = '''    @Override
          public int onStartCommand(Intent intent, int flags, int startId) {
              promoteToForeground();
              String action = intent == null ? ACTION_START : intent.getAction();
              if (ACTION_SELECT.equals(action)) {
                  scheduleSelection();
              } else {
                  scheduleRuntime(ACTION_RESTART.equals(action));
              }
              return START_STICKY;
          }
          '''.replace("          ", "")
          new_on_start = '''    @Override
          public int onStartCommand(Intent intent, int flags, int startId) {
              promoteToForeground();
              String action = intent == null ? ACTION_RECOVER_TASK : intent.getAction();

              // A real user/system request may reopen a circuit that was intentionally paused
              // after repeated failures. START_STICKY restarts use a null Intent and do not.
              if (intent != null && (ACTION_RESTART.equals(action) || ACTION_SELECT.equals(action))) {
                  resetRecoveryCircuit();
              } else if (intent != null
                      && ACTION_START.equals(action)
                      && automaticRecoveryPaused) {
                  resetRecoveryCircuit();
              }

              if (ACTION_SELECT.equals(action)) {
                  scheduleSelection();
              } else {
                  scheduleRuntime(ACTION_RESTART.equals(action));
              }
              return START_STICKY;
          }
          '''.replace("          ", "")
          replace_once(service, old_on_start, new_on_start)

          replace_once(
              service,
              '        if (starting) {\n            notifyListeners();\n            return;\n        }\n',
              '        if (starting) {\n            notifyListeners();\n            return;\n        }\n'
              '        if (!forceRestart && automaticRecoveryPaused) {\n'
              '            notifyListeners();\n'
              '            return;\n'
              '        }\n'
          )

          # Clear recovery state after a fully successful startup/activation.
          replace_once(
              service,
              '            consecutiveFailures = 0;\n            restartNotBeforeElapsed = 0L;\n',
              '            consecutiveFailures = 0;\n'
              '            restartNotBeforeElapsed = 0L;\n'
              '            persistentRecoveryPerformed = false;\n'
              '            automaticRecoveryPaused = false;\n'
          )
          replace_once(
              service,
              '        consecutiveFailures = 0;\n        restartNotBeforeElapsed = 0L;\n        updateNotification();',
              '        consecutiveFailures = 0;\n'
              '        restartNotBeforeElapsed = 0L;\n'
              '        persistentRecoveryPerformed = false;\n'
              '        automaticRecoveryPaused = false;\n'
              '        updateNotification();'
          )

          old_report = '''    private void reportFailure(Throwable error) {
              consecutiveFailures = Math.min(consecutiveFailures + 1, 20);
              long delay = RuntimeRestartBackoff.delayMillis(consecutiveFailures);
              restartNotBeforeElapsed = SystemClock.elapsedRealtime() + delay;
              failure = error.getClass().getSimpleName() + ": " + safeMessage(error);
              status = "PebbleOS will recover automatically";
              updateNotification();
              notifyListeners();
              serviceHandler.postDelayed(() -> scheduleRuntime(false), delay);
          }
          '''.replace("          ", "")
          new_report = '''    private void reportFailure(Throwable error) {
              consecutiveFailures = Math.min(consecutiveFailures + 1, 20);

              if (!persistentRecoveryPerformed
                      && consecutiveFailures >= STATE_RESET_FAILURE_THRESHOLD) {
                  try {
                      new PebbleQemuProcess(this).resetPersistentStateForRecovery();
                      persistentRecoveryPerformed = true;
                  } catch (IOException recoveryError) {
                      error.addSuppressed(recoveryError);
                  }
              }

              failure = error.getClass().getSimpleName() + ": " + safeMessage(error);
              if (consecutiveFailures >= MAX_AUTOMATIC_FAILURES) {
                  automaticRecoveryPaused = true;
                  restartNotBeforeElapsed = Long.MAX_VALUE;
                  status = "PebbleOS recovery paused — reopen NullWrist to retry";
                  updateNotification();
                  notifyListeners();
                  return;
              }

              long delay = RuntimeRestartBackoff.delayMillis(consecutiveFailures);
              restartNotBeforeElapsed = SystemClock.elapsedRealtime() + delay;
              status = persistentRecoveryPerformed
                      ? "PebbleOS state repaired; retrying automatically"
                      : "PebbleOS will recover automatically";
              updateNotification();
              notifyListeners();
              serviceHandler.postDelayed(() -> scheduleRuntime(false), delay);
          }

          private void resetRecoveryCircuit() {
              consecutiveFailures = 0;
              restartNotBeforeElapsed = 0L;
              persistentRecoveryPerformed = false;
              automaticRecoveryPaused = false;
          }
          '''.replace("          ", "")
          replace_once(service, old_report, new_report)

          Path("CHANGELOG_0.8.12.md").write_text('''# NullWrist 0.8.12

          ## Feedback fixes

          - Fixed Android launcher icon registration by moving the launcher icon to proper mipmap resources and adding an adaptive/round icon definition.
          - Hardened stale QEMU cleanup for OEM Android builds that restrict `/proc/<pid>/cmdline` access.
          - Refuses to start a second QEMU if an old same-app QEMU cannot be terminated safely.
          - After repeated failures, rebuilds only PebbleOS SPI/AppDB state from the bundled known-good image while preserving the Android PBW library.
          - Automatic recovery is now bounded: after five consecutive failures it pauses instead of rebooting PebbleOS forever; reopening NullWrist or selecting/restarting a face retries cleanly.
          - Version code 29; version name 0.8.12.
          '''.replace("          ", ""), encoding="utf-8")

          Path("STAGE2_TEST_PLAN.md").write_text('''# NullWrist 0.8.12 feedback test plan

          ## Launcher icon
          1. Clean-install the APK on Titan 2.
          2. Confirm the NullWrist icon appears in the launcher, Settings > Apps and the package installer result screen.
          3. Confirm round/adaptive masking does not crop the floating watch/null symbol.
          4. Update over 0.8.11 and confirm the icon refreshes without clearing app data.

          ## Runtime recovery
          1. Run the selected face continuously for at least one hour.
          2. Reopen/close the main and rear Activities repeatedly; QEMU must not restart when healthy.
          3. Kill the Android parent process abruptly where possible, then reopen NullWrist and verify only one QEMU owns the runtime files.
          4. Repeat recovery on the stock Titan 2 ROM where `/proc/<pid>/cmdline` may be restricted.
          5. Force a native QEMU failure and confirm exponential retries still occur.
          6. Force two consecutive failures and confirm PebbleOS internal SPI/AppDB state is rebuilt without deleting imported PBW files.
          7. Force five consecutive failures and confirm recovery pauses instead of entering an endless PebbleOS reboot loop.
          8. Reopen NullWrist after the pause and confirm a fresh retry starts.
          9. Select another watchface after the pause and confirm the recovery circuit reopens and the new selection can start.
          10. Reboot the phone and confirm BOOT_COMPLETED restoration still works.
          '''.replace("          ", ""), encoding="utf-8")
          PY

      - name: Sanity-check patch
        run: |
          git diff --check
          grep -q 'android:icon="@mipmap/ic_launcher"' app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' app/src/main/AndroidManifest.xml
          grep -q 'MAX_AUTOMATIC_FAILURES = 5' app/src/main/java/com/manufacttest/pebblereardisplay/runtime/PebbleRuntimeService.java
          grep -q 'resetPersistentStateForRecovery' app/src/main/java/com/manufacttest/pebblereardisplay/runtime/PebbleQemuProcess.java

      - name: Commit fixes and remove one-shot workflow
        run: |
          rm -f .github/workflows/apply-feedback-fixes-0.8.12.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix launcher icon and bound PebbleOS recovery"
          git push origin "HEAD:${GITHUB_REF_NAME}"

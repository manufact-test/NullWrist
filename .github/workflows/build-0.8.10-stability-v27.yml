name: Build 0.8.10 stability test v27

on:
  push:
    branches:
      - agent/0.8.10-reliable-runtime
    paths:
      - .github/workflows/build-0.8.10-stability-v27.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/0.8.10-reliable-runtime
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.0.13004108" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pebble-rear-display-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/pebble-rear-display-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Fetch pinned runtime assets
        env:
          PEBBLE_SDK_VERSION: "4.17"
        run: |
          python3 scripts/fetch_bundled_watchfaces.py
          python3 scripts/fetch_pebble_basalt_firmware.py

      - name: Test and assemble signed release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/pebble-rear-display-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:testDebugUnitTest :app:assembleRelease

      - name: Verify and prepare APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk | tee release-certificate.txt
          cp app/build/outputs/apk/release/app-release.apk Pebblehertz-0.8.10-stability-access-v27.apk
          sha256sum Pebblehertz-0.8.10-stability-access-v27.apk | tee apk-sha256.txt

      - name: Upload signed test artifact
        uses: actions/upload-artifact@v4
        with:
          name: pebblehertz-0.8.10-stability-access-signed-v27
          path: |
            Pebblehertz-0.8.10-stability-access-v27.apk
            release-certificate.txt
            apk-sha256.txt
          if-no-files-found: error

      - name: Record artifact and remove temporary workflow
        run: |
          printf 'run_id=%s\nartifact=pebblehertz-0.8.10-stability-access-signed-v27\n' "$GITHUB_RUN_ID" > .stability-v27-run.txt
          rm -f .github/workflows/build-0.8.10-stability-v27.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record signed stability access v27 [skip ci]"
          git push origin HEAD:agent/0.8.10-reliable-runtime

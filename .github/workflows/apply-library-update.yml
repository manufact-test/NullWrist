                  return new File(watchfaceDirectory, metadata.getStorageId());
              }

              private void copyAndReadBundled(
          ''',
              '''    public File fileFor(WatchfaceMetadata metadata) {
                  return new File(watchfaceDirectory, metadata.getStorageId());

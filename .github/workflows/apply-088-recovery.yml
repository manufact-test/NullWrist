name: Apply 0.8.8 import recovery marker

on:
  push:
    branches: ["feature/native-qemu-runtime"]
    paths: [".github/workflows/apply-088-recovery.yml"]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/native-qemu-runtime
          fetch-depth: 0
      - name: Refresh recovery marker and remove workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/manufacttest/pebblereardisplay/runtime/PebbleQemuProcess.java')
          text = path.read_text()
          text = text.replace('KEY_085_RECOVERY_COMPLETED', 'KEY_088_RECOVERY_COMPLETED')
          text = text.replace('recovery_085_completed', 'recovery_088_completed')
          path.write_text(text)
          PY
          rm .github/workflows/apply-088-recovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/manufacttest/pebblereardisplay/runtime/PebbleQemuProcess.java .github/workflows/apply-088-recovery.yml
          git commit -m "Refresh partial import recovery for 0.8.8"
          git push origin HEAD:feature/native-qemu-runtime

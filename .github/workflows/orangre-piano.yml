name: orangre piano — Android release

on:
  push:
    branches: ["orangre-piano/**"]
    paths:
      - "orangre-piano/**"
      - ".github/workflows/orangre-piano.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orangre-piano-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orangre-piano
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build and lint badge-enabled launcher
        run: gradle :app:assembleDebug :app:lintDebug --stacktrace

      - name: Verify APK signature, metadata and notification listener
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$SIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/orangre-badging.txt"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > "$RUNNER_TEMP/orangre-manifest.txt"
          grep -q "package: name='com.orangrepiano.launcher'" "$RUNNER_TEMP/orangre-badging.txt"
          grep -q "targetSdkVersion:'36'" "$RUNNER_TEMP/orangre-badging.txt"
          grep -q "application-icon-" "$RUNNER_TEMP/orangre-badging.txt"
          grep -q 'BIND_NOTIFICATION_LISTENER_SERVICE' "$RUNNER_TEMP/orangre-manifest.txt"
          grep -q 'PianoNotificationListener' "$RUNNER_TEMP/orangre-manifest.txt"
          echo "Verified: only badge-enabled APK, listener present and user authorization required"

      - uses: actions/upload-artifact@v4
        with:
          name: orangre-piano-1.1.3-rc1-apk
          path: orangre-piano/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare protected production signing
        env:
          PIANO_KEYSTORE_B64: ${{ secrets.PIANO_KEYSTORE_B64 }}
          PIANO_STORE_PASSWORD: ${{ secrets.PIANO_STORE_PASSWORD }}
          PIANO_KEY_ALIAS: ${{ secrets.PIANO_KEY_ALIAS }}
          PIANO_KEY_PASSWORD: ${{ secrets.PIANO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$PIANO_KEYSTORE_B64" && -n "$PIANO_STORE_PASSWORD" && -n "$PIANO_KEY_ALIAS" && -n "$PIANO_KEY_PASSWORD" ]]; then
            umask 077
            printf '%s' "$PIANO_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/orangre-piano-release.jks"
            keytool -list -keystore "$RUNNER_TEMP/orangre-piano-release.jks" \
              -storepass "$PIANO_STORE_PASSWORD" -alias "$PIANO_KEY_ALIAS" >/dev/null
            echo "PIANO_RELEASE_READY=true" >> "$GITHUB_ENV"
          else
            echo "PIANO_RELEASE_READY=false" >> "$GITHUB_ENV"
            echo "::notice::No protected signing key configured. Publishing a debug-signed release candidate, not a Play Store release."
          fi

      - name: Build signed production APK and AAB
        if: env.PIANO_RELEASE_READY == 'true'
        env:
          PIANO_KEYSTORE_PATH: ${{ runner.temp }}/orangre-piano-release.jks
          PIANO_STORE_PASSWORD: ${{ secrets.PIANO_STORE_PASSWORD }}
          PIANO_KEY_ALIAS: ${{ secrets.PIANO_KEY_ALIAS }}
          PIANO_KEY_PASSWORD: ${{ secrets.PIANO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle :app:assembleRelease :app:bundleRelease --stacktrace
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Upload production deliverables
        if: env.PIANO_RELEASE_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: orangre-piano-v1.1.3-signed-release
          path: |
            orangre-piano/app/build/outputs/apk/release/app-release.apk
            orangre-piano/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Publish GitHub preview or signed release
        if: github.ref == 'refs/heads/orangre-piano/dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$PIANO_RELEASE_READY" == "true" ]]; then
            TAG="orangre-piano-v1.1.3"
            cp app/build/outputs/apk/release/app-release.apk ../orangre-piano-v1.1.3.apk
            cp app/build/outputs/bundle/release/app-release.aab ../orangre-piano-v1.1.3.aab
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$TAG" ../orangre-piano-v1.1.3.apk ../orangre-piano-v1.1.3.aab --clobber --repo "$GITHUB_REPOSITORY"
            else
              gh release create "$TAG" ../orangre-piano-v1.1.3.apk ../orangre-piano-v1.1.3.aab \
                --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
                --title "orangre piano 1.1.3 — ATELIER" \
                --notes "Single badge-enabled launcher: compact 40dp app search equals back arrow, elegant dollar shortcut, active notification counters. Notification access requires explicit system consent. Protected permanent signing enabled."
            fi
          else
            TAG="orangre-piano-v1.1.3-rc1"
            cp app/build/outputs/apk/debug/app-debug.apk ../orangre-piano-v1.1.3-rc1.apk
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$TAG" ../orangre-piano-v1.1.3-rc1.apk --clobber --repo "$GITHUB_REPOSITORY"
            else
              gh release create "$TAG" ../orangre-piano-v1.1.3-rc1.apk \
                --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
                --title "orangre piano 1.1.3 RC1 — ATELIER" \
                --notes "Only one badge-enabled APK: number counters for active clearable notifications, dollar glyph wallet shortcut, and perfectly aligned 40dp search/back controls. Android requires user-authorized Notification Access. Google Play Protect may block direct browser/file-manager installation for this sensitive permission: do not disable Play Protect; use permitted developer ADB installation or approved distribution. Debug signatures change between CI builds, so prior debug APK must generally be uninstalled first. Store release awaits permanent protected signing key." \
                --prerelease
            fi
          fi

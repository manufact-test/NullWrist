name: Publish Pebblehertz release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish or update the matching GitHub prerelease
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.0.13004108" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION"

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$TAG_VERSION" != "$VERSION" ]]; then
              echo "Tag version $TAG_VERSION does not match app version $VERSION" >&2
              exit 1
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_name=Pebblehertz-$VERSION.apk" >> "$GITHUB_OUTPUT"
          echo "artifact_name=pebblehertz-$VERSION-signed-release" >> "$GITHUB_OUTPUT"

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pebble-rear-display-release.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/pebble-rear-display-release.jks" \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.ANDROID_KEY_ALIAS }}" >/dev/null

      - name: Fetch pinned watchfaces
        run: python3 scripts/fetch_bundled_watchfaces.py

      - name: Verify pinned Pebble Time firmware
        env:
          PEBBLE_SDK_VERSION: "4.17"
        run: python3 scripts/fetch_pebble_basalt_firmware.py

      - name: Test and assemble signed release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/pebble-rear-display-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:testDebugUnitTest :app:assembleRelease

      - name: Verify APK certificate
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            app/build/outputs/apk/release/app-release.apk \
            | tee release-certificate.txt

      - name: Prepare release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APK_NAME: ${{ steps.version.outputs.apk_name }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          CHANGELOG="CHANGELOG_${VERSION}.md"
          if [[ -f "$CHANGELOG" ]]; then
            cp "$CHANGELOG" release-notes.md
          else
            cat > release-notes.md <<EOF
          # Pebblehertz $VERSION

          Pebble watchfaces on the rear display of the Unihertz Titan 2 — no root required.
          EOF
          fi

      - name: Upload signed build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: |
            ${{ steps.version.outputs.apk_name }}
            release-certificate.txt
            release-notes.md
          if-no-files-found: error

      - name: Publish GitHub prerelease
        if: github.ref_type == 'tag' || inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Pebblehertz ${{ steps.version.outputs.version }} Beta
          prerelease: true
          make_latest: true
          fail_on_unmatched_files: true
          files: ${{ steps.version.outputs.apk_name }}
          body_path: release-notes.md

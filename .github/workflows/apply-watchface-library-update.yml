          fetch = fetch.replace(
              "def resolve_download_url(entry: dict[str, str]) -> str:\n    page_url = with_developer_links(entry[\"page_url\"])\n",
              "def resolve_download_url(entry: dict[str, object]) -> str:\n"
              "    fallback = str(entry.get(\"download_url\", \"\"))\n"
              "    if entry.get(\"prefer_download_url\") and fallback:\n"
              "        return fallback\n"
              "    page_url = with_developer_links(str(entry[\"page_url\"]))\n"
          )
          fetch = fetch.replace(
              "        fallback = entry.get(\"download_url\")\n        if fallback:\n",
              "        if fallback:\n"
          )
          fetch = fetch.replace(
              "def download(entry: dict[str, str]) -> None:\n",
              "def repair_crc_archive(source: Path, destination: Path) -> None:\n"
              "    with zipfile.ZipFile(source) as archive:\n"
              "        entries = archive.infolist()\n"
              "    with zipfile.ZipFile(destination, \"w\", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as output:\n"
              "        for info in entries:\n"
              "            if info.is_dir():\n"
              "                repaired = zipfile.ZipInfo(info.filename, info.date_time)\n"
              "                repaired.external_attr = info.external_attr\n"
              "                output.writestr(repaired, b\"\")\n"
              "                continue\n"
              "            extracted = subprocess.run(\n"
              "                [\"unzip\", \"-p\", str(source), info.filename],\n"
              "                stdout=subprocess.PIPE,\n"
              "                stderr=subprocess.PIPE,\n"
              "                check=False,\n"
              "            )\n"
              "            if extracted.returncode not in (0, 2) or len(extracted.stdout) != info.file_size:\n"
              "                raise RuntimeError(f\"Could not repair {info.filename} in {source.name}\")\n"
              "            repaired = zipfile.ZipInfo(info.filename, info.date_time)\n"
              "            repaired.compress_type = zipfile.ZIP_DEFLATED\n"
              "            repaired.external_attr = info.external_attr\n"
              "            repaired.create_system = info.create_system\n"
              "            output.writestr(\n"
              "                repaired,\n"
              "                extracted.stdout,\n"
              "                compress_type=zipfile.ZIP_DEFLATED,\n"
              "                compresslevel=9,\n"
              "            )\n"
              "\n\n"
              "def download(entry: dict[str, object]) -> None:\n"
          )
          old_download = '''    destination = OUTPUT_DIRECTORY / entry["file"]
    expected_hash = entry["sha256"].lower()

    if destination.exists() and sha256(destination) == expected_hash:
        print(f"Using cached {entry['name']} {entry['version']}")
        return

    temporary = destination.with_suffix(destination.suffix + ".part")
    temporary.unlink(missing_ok=True)

    download_url = resolve_download_url(entry)
    request = urllib.request.Request(download_url, headers={"User-Agent": USER_AGENT})

    print(f"Downloading {entry['name']} {entry['version']} from {download_url}")
    total = 0
    try:
        with urllib.request.urlopen(request, timeout=120) as response, temporary.open("wb") as output:
            while True:
                chunk = response.read(64 * 1024)
                if not chunk:
                    break
                total += len(chunk)
                if total > MAX_BYTES:
                    raise RuntimeError(f"{entry['name']}: PBW exceeds {MAX_BYTES} bytes")
                output.write(chunk)

        actual_hash = sha256(temporary)
        if actual_hash != expected_hash:
            raise RuntimeError(
                f"{entry['name']}: SHA-256 mismatch; expected {expected_hash}, got {actual_hash}"
            )

        validate_pbw(temporary, entry["name"])
        shutil.move(str(temporary), str(destination))
    finally:
        temporary.unlink(missing_ok=True)
'''
          new_download = '''    destination = OUTPUT_DIRECTORY / str(entry["file"])
    expected_hash = str(entry["sha256"]).lower()
    expected_source_hash = str(entry.get("source_sha256", expected_hash)).lower()

    if destination.exists() and sha256(destination) == expected_hash:
        validate_pbw(destination, str(entry["name"]))
        print(f"Using cached {entry['name']} {entry['version']}")
        return

    temporary = destination.with_suffix(destination.suffix + ".part")
    repaired = destination.with_suffix(destination.suffix + ".repaired")
    temporary.unlink(missing_ok=True)
    repaired.unlink(missing_ok=True)

    download_url = resolve_download_url(entry)
    request = urllib.request.Request(download_url, headers={"User-Agent": USER_AGENT})

    print(f"Downloading {entry['name']} {entry['version']} from {download_url}")
    total = 0
    try:
        with urllib.request.urlopen(request, timeout=120) as response, temporary.open("wb") as output:
            while True:
                chunk = response.read(64 * 1024)
                if not chunk:
                    break
                total += len(chunk)
                if total > MAX_BYTES:
                    raise RuntimeError(f"{entry['name']}: PBW exceeds {MAX_BYTES} bytes")
                output.write(chunk)

        actual_source_hash = sha256(temporary)
        if actual_source_hash != expected_source_hash:
            raise RuntimeError(
                f"{entry['name']}: source SHA-256 mismatch; expected "
                f"{expected_source_hash}, got {actual_source_hash}"
            )

        candidate = temporary
        if entry.get("repair_crc"):
            repair_crc_archive(temporary, repaired)
            candidate = repaired

        actual_hash = sha256(candidate)
        if actual_hash != expected_hash:
            raise RuntimeError(
                f"{entry['name']}: SHA-256 mismatch; expected {expected_hash}, got {actual_hash}"
            )

        validate_pbw(candidate, str(entry["name"]))
        shutil.move(str(candidate), str(destination))
    finally:
        temporary.unlink(missing_ok=True)
        repaired.unlink(missing_ok=True)
'''
          if old_download not in fetch:

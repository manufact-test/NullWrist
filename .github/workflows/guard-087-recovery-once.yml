name: Guard Pebblehertz 0.8.7 recovery once

on:
  push:
    branches: ["feature/native-qemu-runtime"]
    paths:
      - "scripts/guard_087_recovery_once.py"
      - ".github/workflows/guard-087-recovery-once.yml"

concurrency:
  group: guard-pebblehertz-087-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply one-time recovery guard
        run: |
          python3 -m py_compile scripts/guard_087_recovery_once.py
          python3 scripts/guard_087_recovery_once.py

      - name: Commit clean source
        run: |
          rm scripts/guard_087_recovery_once.py
          rm .github/workflows/guard-087-recovery-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Guard stale import recovery as one-time migration"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
